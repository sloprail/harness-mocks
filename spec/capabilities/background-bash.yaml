statement: >-
  A shell command can be started in the background: the agent gets a receipt
  at once naming the task and the file its output goes to, and the command
  keeps running while the agent works.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/tools-reference#background-commands
    runs:
      - claude-mock/snapshots/runs/bgbash
      - claude-mock/snapshots/runs/midturn
    deviations:
      - adr: modeled-surface
        statement: >-
          The mock does not model a background command's time limit: the docs
          give 30 minutes by default, or the timeout passed with
          run_in_background up to 2 hours (raised by BASH_DEFAULT_TIMEOUT_MS and
          BASH_MAX_TIMEOUT_MS), and a stop notice reading 'Background command
          "<description>" was stopped after reaching its background time
          limit'. A mock's background command runs until it ends or the session
          reaps it.
      - adr: modeled-surface
        statement: >-
          The mock does not model a foreground command moving to the
          background: the docs say one that reaches its timeout is moved to the
          background ('Command did not complete within its 120s timeout and was
          moved to the background', with the task id and output file), and that
          a foreground sub-agent's moved command still stops when that
          sub-agent's run ends. A mock's foreground command is never moved.
      - adr: modeled-surface
        statement: >-
          The mock has no /tasks command (interactive only) to list and stop
          background tasks, and no interactive session in which a command
          started by the main conversation keeps running after a final
          response: a mock's session is non-interactive, where the run ends
          the command (background-bash-reaped-at-exit).
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#tool-coverage
      - https://developers.openai.com/codex/cli/reference#check-background-terminals-with-ps
    runs:
      - codex-mock/snapshots/runs/background-bash-start
    deviations:
      - adr: capability-grounding
        statement: >-
          Codex has no background shell mode: a command started with a yield
          time (unified exec, exec_command) returns once the time is up, and a
          command still running then is answered with a receipt naming only a
          session id (chunk_id, wall_time_seconds, session_id,
          original_token_count and the output so far), not a task and not a
          file its output goes to; the output is read by polling the session.
          The command is not the agent's to outlive the run: it is still
          running when codex exec ends and dies with it, shown on the event
          stream as started and never completed (recorded:
          runs/background-bash-start). The mock does the same.
      - adr: modeled-surface
        statement: >-
          The mock does not model polling a running command (write_stdin), the
          PostToolUse the docs say a later poll delivers when the command
          finishes, or the /ps and /stop terminal commands: a command still
          running after its yield time fires no PostToolUse and is only ended
          with the run. A scenario asks for the yield with a yield_time_ms
          beside the Bash command; a command that ends within it is answered
          with its output as any command is.
  cursor:
    docs:
      - https://cursor.com/docs/hooks#posttooluse
      - https://cursor.com/docs/hooks#aftershellexecution
    runs:
      - cursor-mock/snapshots/runs/background-bash-start
    deviations:
      - adr: modeled-surface
        statement: >-
          The mock does not model what Cursor tells the model of a background
          command in words ("Background command started successfully", the
          shell id, pid, command and the file its output goes to) or the
          follow-up turn the real harness gives the model when the command ends
          ("Briefly inform the user about the task result ..."): a mock has no
          model. What it models is the receipt's facts: the Shell call's
          completed frame (isBackground, shellId, pid, terminalsFolder), the
          postToolUse output {shell_id, pid}, the output file
          <terminals>/<shell id>.txt, the task_notification frame at the
          command's end, and the run waiting for the command. The header the
          real output file may carry is not recorded, and the mock's file holds
          the command's output alone.
      - adr: modeled-surface
        statement: >-
          The mock does not model a foreground command that reaches its timeout
          moving to the background (timeoutBehavior TIMEOUT_BEHAVIOR_BACKGROUND
          in the recorded Shell frames), nor a background time limit: a mock's
          background command runs until it ends.

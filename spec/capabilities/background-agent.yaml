statement: >-
  A sub-agent can be dispatched in the background: the agent gets a receipt at
  once, and the sub-agent runs concurrently with the turn that launched it.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/sub-agents#run-subagents-in-foreground-or-background
      - https://code.claude.com/docs/en/sub-agents#concurrent-subagent-limit
    runs:
      - claude-mock/snapshots/runs/bgagent
      - claude-mock/snapshots/runs/bgagent-definition
      - claude-mock/snapshots/runs/bgagent-concurrent-limit
      - claude-mock/snapshots/runs/bgagent-nested-launcher
    deviations:
      - adr: modeled-surface
        statement: >-
          The mock's executor does not implement the SendMessage tool, so it does not
          model a finished sub-agent resumed in the background by a message, nor
          that a resume takes a slot without the concurrent limit refusing it.
      - adr: modeled-surface
        statement: >-
          The mock does not model what the docs say of a background sub-agent's
          background shell command that runs past the end of its turn: that Claude
          Code sends the sub-agent a notification when the command ends. A mock
          sub-agent is a script run to its result, which nothing wakes again.
      - adr: modeled-surface
        statement: >-
          The mock has no model API to fail: it does not model the docs' hand-back of
          a background sub-agent whose run ends on an API error, which is marked
          failed, the message Claude receives naming the error and including the
          sub-agent's last output.
      - adr: modeled-surface
        statement: >-
          The mock does not model conversation forks: `/subtask` and `/fork` are
          slash commands of an interactive session, and the docs' rule that a fork
          takes a slot of the concurrent limit while it runs, and is never refused
          by it, is theirs.
      - adr: modeled-surface
        statement: >-
          The mock does not take tools away from a background sub-agent: the docs
          give it a smaller built-in tool set than a foreground one (Read, Grep,
          Glob, LSP, Bash, Edit, Write, WebFetch, Monitor, SendMessage and a few
          more), but every tool the docs remove from it is one the mock's
          executor does not implement for any sub-agent.
      - adr: modeled-surface
        statement: >-
          The mock does not model an in-process agent team's teammates: the docs say
          a sub-agent a teammate spawns runs in the foreground, that spawning one
          whose definition sets `background: true` is refused with an error, and
          that a teammate's `run_in_background` is refused where fork mode is off.
          Agent teams are an interactive-session feature, and so is fork mode, which
          makes every sub-agent run in the background: a mock session is `-p`, with
          fork mode off.
      - adr: modeled-surface
        statement: >-
          The mock does not model the sessions the docs exempt from the concurrent
          sub-agent limit: those with ultracode active, which is turned on through
          the effort level in an interactive session.
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#common-input-fields
    runs:
      - codex-mock/snapshots/runs/background-agent
    deviations:
      - adr: capability-grounding
        statement: >-
          Codex's spawn_agent has no foreground or background choice: it
          always answers at once with a receipt (the sub-agent's id and a
          nickname) and the sub-agent runs concurrently with the turn, its
          hooks firing under the same session id with an agent_id and an
          agent_type (recorded: runs/background-agent).
      - adr: modeled-surface
        statement: >-
          The mock's spawn_agent is told by a parameter of its own, background,
          that the dispatch is not waited for (without it the mock waits for
          the sub-agent and answers as a following wait would); the sub-agent
          runs on its own thread and rollout, driven by the scenario script it
          is given, and is stopped if still running when the run ends. The
          sub-agent's states after pending_init, and what the agent is told
          when a hook refuses the spawn, are not modelled.
  cursor:
    docs:
      - https://cursor.com/docs/hooks#subagentstart
    runs:
      - cursor-mock/snapshots/runs/background-agent
    deviations:
      - adr: modeled-surface
        statement: >-
          The mock plays the sub-agent as a script it is given by a parameter
          of its own, script (the real one is a model); only a Task that asks
          for the background and carries that script is modelled, and no hook
          of the call can refuse it.

statement: >-
  A session can be resumed by id: it continues in its existing transcript,
  even when resumed from another working directory, and a top-level resume
  fires session hooks but no sub-agent hooks.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/cli-reference#cli-flags
      - https://code.claude.com/docs/en/agent-sdk/sessions#resume-by-id
      - https://code.claude.com/docs/en/headless#continue-conversations
    runs:
      - claude-mock/snapshots/runs/forkresume
      - claude-mock/snapshots/runs/compact
      - claude-mock/snapshots/runs/resume-continue
      - claude-mock/snapshots/runs/resume-path
      - claude-mock/snapshots/runs/resume-name
      - claude-mock/snapshots/runs/no-session-persistence
      - claude-mock/snapshots/runs/resume-continue-none
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock spends no tokens, so a resume's context_tokens and
          estimated_cache_write_usd are 0, where the real ones (recorded in
          every resume run) are the size of the context to send again and its
          price.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The CLI reference's interactive parts of --resume and --continue are
          not modeled: the session picker --resume opens without an ID, --continue
          passing over a session whose first prompt was a /loop, one that added
          the directory with /add-dir (slash commands), and a --resume ID lookup
          that tries the project's git worktrees before other projects (the mock
          tries the directory's project, then any other). The init frame that
          opens a resumed session's stream, after the hooks' own frames, is the
          scenario script's in the mock, which writes none.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          Background sessions, which the CLI reference says --resume opens while
          they run and --continue opens once finished, exist only in an
          interactive session's agent view: the mock has none to open.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock does not model --name, naming a session when it starts: the
          sessions it writes carry its fixed title and no agent-name record. It
          finds a session by the name its transcript records (the real
          harness's, as in runs/resume-name) and tells the resume's SessionStart
          that name as session_title, with the stream's session_title_changed
          frame. The recorded resume's UserPromptSubmit carries the name as
          well, which the mock's does not.
  codex:
    docs:
      - https://developers.openai.com/codex/noninteractive#resume-a-non-interactive-session
      - https://developers.openai.com/codex/hooks#sessionstart
    runs:
      - codex-mock/snapshots/runs/session-resume
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          Only a session named by its id (`codex exec resume <id>`) is
          modeled: resuming the newest session (`--last`), a session by its
          thread name, and the interactive resume picker are not.
  cursor:
    docs:
      - https://cursor.com/docs/hooks#sessionstart
      - https://cursor.com/docs/hooks#sessionend
    runs:
      - cursor-mock/snapshots/runs/session-resume
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Resumed from another working directory, cursor-agent keeps the
          session's id and fires that directory's session hooks, but it does
          not continue the conversation: the agent has none of the earlier
          messages, and the transcript it writes there holds only the new
          ones. Only a session resumed from the directory it was begun in
          continues in its existing transcript (recorded: runs/session-resume).
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          A resumed session fires cursor-agent's end hook (sessionEnd) but not
          its start hook (sessionStart): the start hook fires only when a
          session begins (recorded: runs/session-resume).
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          Only `--resume <session-id>` is modeled: `--continue`, the resume
          picker and `agent resume` are not.

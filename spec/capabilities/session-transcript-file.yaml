statement: >-
  Each session's transcript is a file under the configuration directory, keyed
  by the working directory with symlinks resolved and by the session id; a
  fresh session's file does not exist yet when the start hook runs.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/claude-directory#application-data
      - https://code.claude.com/docs/en/env-vars#variables
    runs:
      - claude-mock/snapshots/runs/stops
      - claude-mock/snapshots/runs/forkresume
      - claude-mock/snapshots/runs/hookerrors
      - claude-mock/snapshots/runs/symlinked-cwd
      - claude-mock/snapshots/runs/transcript-at-start
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#common-input-fields
    runs:
      - codex-mock/snapshots/runs/session-transcript-file
    deviations:
      - adr: capability-grounding
        statement: >-
          Codex does not key the transcript by working directory: its rollout
          file is <config dir>/sessions/YYYY/MM/DD/rollout-<start time>-<session
          id>.jsonl, the day it started and the session id, and the working
          directory is only a field of the file's first record
          (recorded: runs/session-transcript-file). The mock does the same.
      - adr: capability-grounding
        statement: >-
          Codex creates a fresh session's file before the start hook runs: the
          file the SessionStart payload's transcript_path names already exists
          then, and the mock does the same (recorded: runs/session-transcript-file).
  cursor:
    docs:
      - https://cursor.com/docs/hooks#common-schema
    runs:
      - cursor-mock/snapshots/runs/tool-failure
      - cursor-mock/snapshots/runs/symlinked-cwd
    deviations:
      - adr: modeled-surface
        statement: >-
          cursor-agent has no transcript file until the first tool call is under
          way: the hooks of its first preToolUse (and usually its first
          beforeShellExecution) find no file and carry a null transcript_path.
          The mock writes its file, with the user's message, before the first
          turn, because the scenario script reads it as the session so far, so
          those hooks find a file; its payloads carry the path once the first
          preToolUse has run, and not before (the start hook's does not, as
          recorded).

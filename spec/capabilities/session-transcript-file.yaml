statement: >-
  Each session writes its transcript to a file at a location the harness
  determines, and the session's hooks can discover it (a transcript path in
  their payload).
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/claude-directory#application-data
      - https://code.claude.com/docs/en/env-vars#variables
    runs:
      - claude-mock/snapshots/runs/stops
      - claude-mock/snapshots/runs/forkresume
      - claude-mock/snapshots/runs/hookerrors
      - claude-mock/snapshots/runs/symlinked-cwd
      - claude-mock/snapshots/runs/transcript-at-start
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#common-input-fields
    runs:
      - codex-mock/snapshots/runs/session-transcript-file
      - codex-mock/snapshots/runs/session-transcript-file-hooks
      - codex-mock/snapshots/runs/ephemeral-no-transcript
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          With --ephemeral Codex keeps no transcript: no rollout exists under the
          configuration directory, and every hook payload has transcript_path
          null, on each event the run fires (SessionStart, PreToolUse,
          PostToolUse, Stop, SessionEnd; recorded: runs/ephemeral-no-transcript).
          The mock does the same.
  cursor:
    docs:
      - https://cursor.com/docs/hooks#common-schema
    runs:
      - cursor-mock/snapshots/runs/tool-failure
      - cursor-mock/snapshots/runs/symlinked-cwd
      - cursor-mock/snapshots/runs/shell-exit-status
      - cursor-mock/snapshots/runs/hook-json-nonzero
      - cursor-mock/snapshots/runs/workspace-open
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Doc and recording conflict: the hooks doc (#common-schema) says
          transcript_path is "Path to the main conversation transcript file
          (null if transcripts disabled)", and the recordings show it null with
          transcripts on, at sessionStart and the first preToolUse in every
          capture (recorded: runs/tool-failure, runs/symlinked-cwd,
          runs/shell-exit-status, runs/hook-json-nonzero). The recordings
          decide.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Cursor does not settle when the payload first names the transcript.
          Its transcript_path is null at sessionStart and on the first
          preToolUse in every capture, and names the file from the first
          command's afterShellExecution on; in between, the first
          beforeShellExecution names it in some captures (recorded:
          runs/tool-failure, runs/symlinked-cwd) and carries null in others
          (recorded: runs/shell-exit-status, runs/hook-json-nonzero). The mock
          names it from the first beforeShellExecution on, one of the two
          recorded behaviours.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The docs say transcript_path is null when transcripts are disabled;
          the mock has no setting to disable them, so it always keeps a
          transcript and names it in the payloads.

statement: >-
  Hooks are configured per event with an optional matcher, and a hook runs
  only for events whose subject (for tool events, the tool name) matches it.
  An event with no subject takes every hook, whatever its matcher. (A finer
  condition on a tool's arguments is not a matcher and is not part of this.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#matcher-patterns
    runs:
      - claude-mock/snapshots/runs/matcher
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#matcher-patterns
    runs:
      - codex-mock/snapshots/runs/hook-matchers
    deviations:
      - adr: modeled-surface
        statement: >-
          The mock fires no PermissionRequest, PreCompact, PostCompact,
          SubagentStart or SubagentStop event and has no MCP tools or
          sub-agents, so the matcher variants of those (MCP tool names such as
          mcp__filesystem__.*, the manual|auto compaction triggers, the
          sub-agent types, and spawn_agent also matching Agent) are not
          modeled. The mock's tool-name aliases are only apply_patch matching
          Edit and Write.

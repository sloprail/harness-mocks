statement: >-
  Hooks are configured per event with an optional matcher, and a hook runs
  only for events whose subject (for tool events, the tool name) matches it.
  An event with no subject takes every hook, whatever its matcher. (A finer
  condition on a tool's arguments is not a matcher and is not part of this.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#matcher-patterns
    runs:
      - claude-mock/snapshots/runs/matcher
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#matcher-patterns
    runs:
      - codex-mock/snapshots/runs/hook-matchers
  cursor:
    docs:
      - https://cursor.com/docs/hooks#matcher-configuration
      - https://cursor.com/docs/hooks#per-script-configuration-options
    runs:
      - cursor-mock/snapshots/runs/hook-matchers
    deviations:
      - adr: modeled-surface
        statement: >-
          The mock fires only the events it fires (sessionStart, sessionEnd,
          preToolUse, postToolUse, postToolUseFailure, beforeShellExecution,
          afterShellExecution and afterFileEdit), so the matchers of the other events
          (subagentStart, subagentStop, beforeReadFile, beforeSubmitPrompt, stop,
          afterAgentResponse, afterAgentThought and the rest) are not modeled.

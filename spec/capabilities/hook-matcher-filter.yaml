statement: >-
  Hooks are configured per event with an optional matcher, and a hook runs
  only for events whose subject (for tool events, the tool name) matches it.
  An event with no subject takes every hook, whatever its matcher. (A finer
  condition on a tool's arguments is not a matcher and is not part of this.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#matcher-patterns
    runs:
      - claude-mock/snapshots/runs/matcher
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock defines only the events named in
          claude-mock/internal/hooks/event.go (SessionStart, SessionEnd, Stop,
          StopFailure, SubagentStart, SubagentStop, PreToolUse, PostToolUse,
          PostToolUseFailure, WorktreeCreate, WorktreeRemove, PreCompact,
          PostCompact, UserPromptSubmit), so the matcher rows of the docs'
          table for the other events (Notification, Setup, ConfigChange and
          the like) are not modeled.
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#matcher-patterns
    runs:
      - codex-mock/snapshots/runs/hook-matchers
      - codex-mock/snapshots/runs/hook-matcher-omitted
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock fires no PermissionRequest event and has no MCP tools, and
          its hook matchers read no compaction trigger or sub-agent type, so the
          matcher variants of those (MCP tool names such as
          mcp__filesystem__.*, the manual|auto compaction triggers, the
          sub-agent types, and spawn_agent also matching Agent) are not
          modeled. The mock's tool-name aliases are only apply_patch matching
          Edit and Write.
  cursor:
    docs:
      - https://cursor.com/docs/hooks#matcher-configuration
      - https://cursor.com/docs/hooks#per-script-configuration-options
    runs:
      - cursor-mock/snapshots/runs/hook-matchers
      - cursor-mock/snapshots/runs/hook-matchers-after-events
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock fires only the events it fires (sessionStart, sessionEnd,
          preToolUse, postToolUse, postToolUseFailure, beforeShellExecution,
          afterShellExecution and afterFileEdit), so the matchers of the other events
          (subagentStart, subagentStop, beforeReadFile, beforeSubmitPrompt, stop,
          afterAgentResponse, afterAgentThought and the rest) are not modeled.

statement: >-
  A hook fires when the session ends and says why; a non-interactive run
  reports a generic reason. Whatever the hook prints is not recorded in the
  transcript. (How long it may run is hook-timeout's, and which reasons a
  configured matcher selects is hook-matcher-filter's.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#sessionend
      - https://code.claude.com/docs/en/hooks#sessionend-input
    runs:
      - claude-mock/snapshots/runs/hookerrors
      - claude-mock/snapshots/runs/hook-exit-codes
    deviations:
      - adr: modeled-surface
        statement: >-
          The reasons clear, resume, logout and prompt_input_exit belong to an
          interactive session (/clear, /resume, a logout, an exit from the
          prompt). The mock models none, so every session ends with the
          generic reason.
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#sessionend
    runs:
      - codex-mock/snapshots/runs/session-end
    deviations:
      - adr: modeled-surface
        statement: >-
          The docs name SessionEnd triggers of an app-managed thread: archiving
          or deleting it, and 30 minutes of idleness. The mock models a
          non-interactive run, which ends with its turn, so it fires SessionEnd
          for that only.
      - adr: capability-grounding
        statement: >-
          That what the hook prints is not recorded in the transcript is not
          shown for Codex: the docs say only that SessionEnd hooks are advisory
          and their output does not steer Codex, and the recorded run's hook
          prints nothing. The mock does not record it.
  cursor:
    docs:
      - https://cursor.com/docs/hooks#sessionend
    runs:
      - cursor-mock/snapshots/runs/pretool-refusal
      - cursor-mock/snapshots/runs/session-end-hook-output
    deviations:
      - adr: modeled-surface
        statement: >-
          The mock has no interactive session, and models a run that ends by its
          script's result, so the sessionEnd reasons window_close, user_close, aborted
          and error, and the error message that goes with a reason of error, are not
          modeled: it always says completed.

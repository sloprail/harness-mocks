statement: >-
  Every conversation record in a transcript (user, assistant, attachment and
  system records) carries the bookkeeping a reader relies on: session, working
  directory, branch, timestamp, version and how the run
  was launched; a prompt given to a non-interactive run is marked as such.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/claude-directory#application-data
    runs:
      - claude-mock/snapshots/runs/bgbash
      - claude-mock/snapshots/runs/midturn
      - claude-mock/snapshots/runs/bgagent
  codex:
    supported: false
    reason: >-
      Codex does not stamp the bookkeeping on every record: session, start time,
      working directory, branch, version and launch mode are carried by the first
      record (session_meta); a turn_context record repeats the working directory
      and item events carry a thread id, and the other records carry just a
      timestamp. The prompt of a non-interactive run is not marked.
    docs:
      - https://developers.openai.com/codex/hooks#common-input-fields
    runs:
      - codex-mock/snapshots/runs/session-transcript-file
  cursor:
    supported: false
    reason: >-
      Cursor's transcript records carry only a role and a message, and its
      turn_ended record only a status: no session, working directory, branch,
      version or launch mode on any of them, and no time value (the user
      record holds an empty <timestamp/> element, nothing else), for a -p run's
      prompt included.
    runs:
      - cursor-mock/snapshots/runs/tool-failure
      - cursor-mock/snapshots/runs/symlinked-cwd

statement: >-
  A sub-agent dispatch that lacks its required description or prompt is
  refused with an input-validation error before any hook runs, and nothing
  runs.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/tools-reference#agent-tool-behavior
    runs:
      - claude-mock/snapshots/runs/agent-invalid-input
      - claude-mock/snapshots/runs/agent-invalid-description
      - claude-mock/snapshots/runs/tool-invalid-input
  codex:
    supported: false
    reason: >-
      Codex does not refuse a dispatch before any hook runs: PreToolUse fires with
      the call as the agent made it, even an empty one, and only then is it
      refused (it requires a message or items, not a description and a prompt);
      nothing runs after that.
    docs:
      - https://developers.openai.com/codex/hooks#pretooluse
    runs:
      - codex-mock/snapshots/runs/agent-input-validation
      - codex-mock/snapshots/runs/agent-input-validation-spawn
  cursor:
    docs:
      - https://cursor.com/docs/hooks#pretooluse
    runs:
      - cursor-mock/snapshots/runs/agent-input-validation
      - cursor-mock/snapshots/runs/agent-input-validation-description
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Cursor's Task call requires only a prompt: a call without a
          description is not refused but runs with the description empty
          (recorded: runs/agent-input-validation-description). A call without
          its prompt is refused with "Invalid arguments:" and "prompt:
          Required" before any hook (not even preToolUse) fires, and nothing
          runs (recorded: runs/agent-input-validation).
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock runs no sub-agent: a Task call that passes the check
          reaches preToolUse as Cursor's does and is then answered as an
          error.

statement: >-
  Hooks fire when the harness creates or removes an isolated worktree, and a
  failing create hook aborts the creation.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#worktreecreate
      - https://code.claude.com/docs/en/hooks#worktreeremove
    runs:
      - claude-mock/snapshots/runs/worktree-hooks
    deviations:
      - adr: modeled-surface
        statement: >-
          A worktree_create or worktree_remove control record only fires its hook:
          no directory is made or removed behind it, so the hook's returned path is
          not entered, and WorktreeRemove's rule (a non-zero exit fails the removal
          only if the directory still exists) is not modeled. The worktree of an
          isolated sub-agent is the one place the mock runs a WorktreeCreate hook
          for real, and it fires no WorktreeRemove when the sub-agent ends, as the
          recorded run did not.
      - adr: modeled-surface
        statement: >-
          A worktree created by claude --worktree for a session, or for a
          background session in agent view (an interactive surface), has no
          counterpart in the mock, and neither do the path screening of a hook's
          returned path (a path through a symlink, or with . or .. segments, is
          refused) and the .worktreeinclude copy that the default creation does.
  codex:
    supported: false
    reason: Codex's hook events list has no worktree create or remove event.
    docs:
      - https://developers.openai.com/codex/hooks#hooks
  cursor:
    supported: false
    reason: Cursor's hook events list has no worktree create or remove event.
    docs:
      - https://cursor.com/docs/hooks#hook-events

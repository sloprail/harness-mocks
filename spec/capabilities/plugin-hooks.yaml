statement: >-
  Hooks contributed by the plugins a run has enabled run alongside the
  project's own hooks; a plugin that is not enabled, or not loaded,
  contributes none. (Where a plugin's files are fetched from, beyond a
  directory on disk, is not part of this.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#hook-locations
      - https://code.claude.com/docs/en/plugin-marketplaces#add-plugin-entries
    runs:
      - claude-mock/snapshots/runs/plugin-hooks
      - claude-mock/snapshots/runs/plugin-hooks-same-command
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#plugin-bundled-hooks
      - https://developers.openai.com/plugins/build/plugins#add-a-marketplace-from-the-cli
    runs:
      - codex-mock/snapshots/runs/plugin-hooks
      - codex-mock/snapshots/runs/plugin-hook-env
      - codex-mock/snapshots/runs/plugin-hook-trusted
      - codex-mock/snapshots/runs/plugin-hook-untrusted
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock reads what the user layer's config.toml says of plugins (a
          [marketplaces.<name>] table with the directory of a local marketplace,
          a [plugins."<plugin>@<marketplace>"] table with enabled) and the
          plugin's hooks/hooks.json found through the marketplace's
          .agents/plugins/marketplace.json, in place. A plugin's hook command
          is told PLUGIN_ROOT and PLUGIN_DATA, each also under CLAUDE_
          (recorded: runs/plugin-hook-env), and runs only when trusted like any
          hook. It does not model a plugin's install into Codex's cache, git
          marketplaces or a hooks entry in the plugin manifest.
  cursor:
    docs:
      - https://cursor.com/docs/reference/plugins#hooks-format
      - https://cursor.com/docs/plugins#what-plugins-contain
    runs:
      - cursor-mock/snapshots/runs/plugin-hooks
      - cursor-mock/snapshots/runs/plugin-hook-cwd-env
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock loads the directories given with --plugin-dir: the hooks file
          their .cursor-plugin/plugin.json names as a path, or hooks/hooks.json.
          It does not read marketplace manifests, an inline hooks object in the
          manifest, or the account's installed plugins.

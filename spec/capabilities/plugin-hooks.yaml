statement: >-
  Hooks contributed by the plugins a run has enabled run alongside the
  project's own hooks; a plugin that is not enabled, or not loaded,
  contributes none. (Where a plugin's files are fetched from, beyond a
  directory on disk, is not part of this.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#hook-locations
      - https://code.claude.com/docs/en/plugin-marketplaces#add-plugin-entries
    runs:
      - claude-mock/snapshots/runs/plugin-hooks
      - claude-mock/snapshots/runs/plugin-hooks-same-command
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#plugin-bundled-hooks
      - https://developers.openai.com/plugins/build/plugins#add-a-marketplace-from-the-cli
    runs:
      - codex-mock/snapshots/runs/plugin-hooks
      - codex-mock/snapshots/runs/plugin-hook-env
      - codex-mock/snapshots/runs/plugin-hook-trusted
      - codex-mock/snapshots/runs/plugin-hook-untrusted
      - codex-mock/snapshots/runs/plugin-install
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock reads what the user layer's config.toml says of plugins (a
          [marketplaces.<name>] table with the directory of a local marketplace,
          a [plugins."<plugin>@<marketplace>"] table with enabled) and the
          plugin's hooks/hooks.json found through the marketplace's
          .agents/plugins/marketplace.json, in place. A plugin's hook command
          is told PLUGIN_ROOT and PLUGIN_DATA, each also under CLAUDE_
          (recorded: runs/plugin-hook-env, which logs the variables' names, not
          their values), and runs only when trusted like any hook. The values
          are the mock's own choice, shown by no recording: the plugin's
          directory in the cache for the root, $CODEX_HOME/plugins/data/<plugin>-<marketplace>
          for the data directory. It installs an enabled plugin into $CODEX_HOME/plugins/cache/<marketplace>/<plugin>/<version>
          when a run starts (the manifest's version, "local" with none; the
          directory copied whole but for symbolic links; a new version replaces
          the cached one), and runs its hooks from there (recorded:
          runs/plugin-install). It has no `codex plugin` commands, so the
          install happens at the run, not when the plugin is added, and nothing
          removes the cache entry of a plugin that is removed. It
          does not model git marketplaces or a hooks entry in the plugin
          manifest.
  cursor:
    docs:
      - https://cursor.com/docs/reference/plugins#hooks-format
      - https://cursor.com/docs/plugins#what-plugins-contain
    runs:
      - cursor-mock/snapshots/runs/plugin-hooks
      - cursor-mock/snapshots/runs/plugin-hook-cwd-env
      - cursor-mock/snapshots/runs/tui-plugins
      - cursor-mock/snapshots/runs/tui-plugins-event-gating
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock loads the directories given with --plugin-dir: the hooks file
          their .cursor-plugin/plugin.json names as a path, or hooks/hooks.json.
          In a TUI session (not in print mode, where it was not recorded) it also
          loads the user's local plugins, the directories and the symlinks to a
          plugin inside ~/.cursor/plugins/local that hold a
          .cursor-plugin/plugin.json (runs/tui-plugins). It does not read
          marketplace manifests, an inline hooks object in the manifest, or the
          account's installed plugins.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Doc and recording conflict: the plugins reference
          (reference/plugins#hooks-format, "Available hook events") lists, for a
          plugin's hooks/hooks.json, "Agent hooks: `sessionStart`, `sessionEnd`,
          `preToolUse`, `postToolUse`, `postToolUseFailure`, `subagentStart`,
          `subagentStop`, `beforeShellExecution`, `afterShellExecution`,
          `beforeMCPExecution`, `afterMCPExecution`, `beforeReadFile`,
          `afterFileEdit`, `beforeSubmitPrompt`, `preCompact`, `stop`,
          `afterAgentResponse`, `afterAgentThought`" as available, but the
          recordings show a plugin's hooks do not all run in a TUI session, though
          it is loaded. The recordings decide.
          The user's local plugins (~/.cursor/plugins/local/<name>) are
          loaded after the session has started: with the project's sessionStart
          hook taking 12 s, only the plugin loaded with --plugin-dir ran its
          sessionStart hook, and all of them ran every later one (runs/tui-plugins);
          a symlink there to a plugin outside that directory is never loaded
          (p2 of that run), one to a plugin inside it is (p4). A plugin's stop hook
          never ran, though the project's did; and its beforeSubmitPrompt and
          afterAgentResponse hooks ran only when the project's hooks.json
          configures a hook for the same event too (runs/tui-plugins, and
          runs/tui-plugins-event-gating, whose project configures neither). The
          mock does the same, and runs the local plugins' hooks from the first
          prompt on. A print-mode run with the A10N_CURSOR_MOCK_STOP opt-in
          (which fires stop and afterAgentResponse, see stop-block-continuation)
          applies the same rules to the plugins given with --plugin-dir: their
          stop hooks do not fire, their afterAgentResponse hooks only beside one
          in the project's hooks.json.

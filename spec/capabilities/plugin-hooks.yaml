statement: >-
  Hooks contributed by enabled plugins, resolved through the marketplace the
  settings declare, run alongside the project's own hooks; an undeclared
  marketplace or disabled plugin contributes none. (Where a plugin's files are
  fetched from, beyond a directory on disk, is not part of this.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#hook-locations
      - https://code.claude.com/docs/en/plugin-marketplaces#add-plugin-entries
    runs:
      - claude-mock/snapshots/runs/plugin-hooks
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#plugin-bundled-hooks
      - https://developers.openai.com/plugins/build/plugins#add-a-marketplace-from-the-cli
    runs:
      - codex-mock/snapshots/runs/plugin-hooks
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock reads what the user layer's config.toml says of plugins (a
          [marketplaces.<name>] table with the directory of a local marketplace,
          a [plugins."<plugin>@<marketplace>"] table with enabled) and the
          plugin's hooks/hooks.json found through the marketplace's
          .agents/plugins/marketplace.json, in place. It does not model a
          plugin's install into Codex's cache, git marketplaces, a hooks entry
          in the plugin manifest, the PLUGIN_ROOT and PLUGIN_DATA variables a
          plugin's hook command gets, or the trust review of a plugin's hooks.
  cursor:
    supported: false
    reason: >-
      Cursor has no settings file that declares a marketplace or enables a plugin:
      marketplaces and enabled plugins are the account's, managed in Customize,
      and what was recorded is only a plugin directory loaded with --plugin-dir.
    docs:
      - https://cursor.com/docs/reference/plugins#hooks-format
      - https://cursor.com/docs/plugins#what-plugins-contain
    runs:
      - cursor-mock/snapshots/runs/plugin-hooks
statement: >-
  A hook fires each time the agent finishes responding. Its payload carries
  the agent's last message, whether the agent is already continuing because an
  earlier hook blocked, and the background tasks still running. (What those
  tasks, and the scheduled wakeups the payload also lists, look like belongs
  to their own capabilities.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#stop
      - https://code.claude.com/docs/en/hooks#stop-input
    runs:
      - claude-mock/snapshots/runs/stops
      - claude-mock/snapshots/runs/bgbash
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#stop
    runs:
      - codex-mock/snapshots/runs/stops
  cursor: pending

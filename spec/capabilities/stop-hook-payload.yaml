statement: >-
  A hook fires each time the agent finishes responding. Its payload carries
  the agent's last message, whether the agent is already continuing because an
  earlier hook blocked, and the background tasks still running. (What those
  tasks, and the scheduled wakeups the payload also lists, look like belongs
  to their own capabilities.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#stop
      - https://code.claude.com/docs/en/hooks#stop-input
    runs:
      - claude-mock/snapshots/runs/stops
      - claude-mock/snapshots/runs/bgbash
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#stop
    runs:
      - codex-mock/snapshots/runs/stops
      - codex-mock/snapshots/runs/bg-bash-reaped-at-exit
      - codex-mock/snapshots/runs/stop-no-message
      - codex-mock/snapshots/runs/user-prompt-submit-hook-bg
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Codex's Stop payload lists no background tasks: the recorded Stop of
          a turn that ended while a command was still running carries the same
          fields (session, turn, transcript, cwd, model, permission mode,
          stop_hook_active, last_assistant_message) as one with none running,
          and the hooks doc lists no such field.
  cursor:
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          cursor-agent in print mode never fires the stop hook (the run configured
          one logging its payload: runs/stop-hook-payload); only the TUI does
          (runs/tui-stop), and the mock models that. The TUI's stop payload holds
          status, loop_count (the continuation flag) and the token counts.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          The TUI's stop payload carries no last message of the agent (the
          afterAgentResponse hook carries that, runs/tui-stop).
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          The TUI's stop payload has no field for background tasks still running;
          no recording ended a turn with one still running, so whether the payload
          would list it is not shown.
    runs:
      - cursor-mock/snapshots/runs/stop-hook-payload
      - cursor-mock/snapshots/runs/tui-stop

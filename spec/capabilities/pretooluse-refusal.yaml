statement: >-
  A PreToolUse hook can refuse a tool call before it runs, by denying it in
  its output or by blocking it with its exit status; the refusal reaches the
  agent as the tool's error result, the tool does not run, and the turn goes
  on. When several hooks decide one call, a deny wins over any other
  decision. (What exit statuses mean is hook-exit-code-semantics'; changing
  the tool's input or adding context are other capabilities'.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#pretooluse-decision-control
      - https://code.claude.com/docs/en/hooks#exit-code-2-behavior-per-event
    runs:
      - claude-mock/snapshots/runs/stops
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock models a non-interactive run that no SDK host resumes, so a hook's "ask" (a permission prompt) and "defer" (pausing
          the call to resume later) decide nothing in the mock; they only rank
          below deny when several hooks decide one call. Permission rules
          evaluated beside the hook are not modeled.
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#pretooluse
      - https://developers.openai.com/codex/hooks#tool-coverage
    runs:
      - codex-mock/snapshots/runs/stops
      - codex-mock/snapshots/runs/pretool-decisions
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock's tool executor handles only the shell tool (hooks name it
          Bash) and apply_patch, so a refusal of MCP tools and of Codex's other
          local function tools is not modeled. Hosted tools such as web search
          run no hook in Codex either.
  cursor:
    docs:
      - https://cursor.com/docs/hooks#pretooluse
      - https://cursor.com/docs/hooks#beforeshellexecution--beforemcpexecution
      - https://cursor.com/docs/hooks#configuration
      - https://cursor.com/docs/hooks#beforereadfile
    runs:
      - cursor-mock/snapshots/runs/pretool-refusal
      - cursor-mock/snapshots/runs/pretool-refusal-file-tools
      - cursor-mock/snapshots/runs/pretool-refusal-combined
      - cursor-mock/snapshots/runs/before-read-refusal
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock models a non-interactive run with no one to ask, so a hook's
          "ask" (a permission prompt) decides nothing in the mock; it only ranks
          below deny when several hooks decide one call. The call-refusing
          hooks the mock fires are preToolUse, beforeShellExecution and
          beforeReadFile; beforeMCPExecution and subagentStart, which refuse
          too, are not modeled.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Doc and recording conflict: the hooks doc (#pretooluse, the output
          fields) says agent_message is "Message fed back to the agent when the
          action is denied", and the recordings show a deny's agent_message
          (AGENT-DENY-MSG, SHELL-AGENT-DENY-MSG) nowhere in the run's stream,
          hook payloads or transcript: the rejected call's reason carries only
          the user_message (runs/pretool-refusal, runs/pretool-refusal-file-tools).
          The recording decides.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          A deny's agent_message, which the docs say is fed back to the agent as
          the refusal, is not read: the mock has no model to receive it, and the
          recorded stream shows the agent's side of a refusal only as the
          rejected tool call, so only the hook's user_message (the failure
          hook's error_message) is modeled.

statement: >-
  A hook fires when a session begins and, in a harness that starts a session
  in more than one way, says how it began: fresh, resumed, forked, or
  continuing after a compaction. The hook cannot stop the session from
  starting. (What else the hook receives or may return, such as context for
  the agent, is other capabilities'.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#sessionstart-input
      - https://code.claude.com/docs/en/hooks#sessionstart-decision-control
      - https://code.claude.com/docs/en/hooks#exit-code-2-behavior-per-event
    runs:
      - claude-mock/snapshots/runs/hookerrors
      - claude-mock/snapshots/runs/stops
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          A session cleared with /clear starts again with source "clear" in
          Claude Code. The mock parses no slash command, so it never reports
          that source.
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#sessionstart
    runs:
      - codex-mock/snapshots/runs/stops
      - codex-mock/snapshots/runs/hook-exit-codes
      - codex-mock/snapshots/runs/hook-matchers
      - codex-mock/snapshots/runs/session-start-continue-false
      - codex-mock/snapshots/runs/session-start-compact-continue-false
      - codex-mock/snapshots/runs/manual-compaction-auto
      - codex-mock/snapshots/runs/session-fork
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock never clears a session (the source clear), so a session start is the fresh one, source startup, the one after a compaction, source compact, the one a session resumed by its id (`exec resume`) makes, source resume, or the one `exec fork` makes, source fork (recorded: runs/session-fork).
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Unlike the statement, a Codex SessionStart hook can stop the run: one
          returning {"continue":false} ends the turn at once, with no prompt
          hook, tool call or model request after it (recorded:
          runs/session-start-continue-false), and the same for the start that
          follows a compaction, which ends the turn cleanly (recorded:
          runs/session-start-compact-continue-false).
  cursor:
    docs:
      - https://cursor.com/docs/hooks#sessionstart
    runs:
      - cursor-mock/snapshots/runs/session-start-block
      - cursor-mock/snapshots/runs/session-start-continue-false
      - cursor-mock/snapshots/runs/symlinked-cwd
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock never forks or compacts a conversation, so it fires one
          sessionStart hook per run, at the fresh start.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          A conversation resumed by its id (`--resume`) fires no sessionStart
          hook in cursor-agent, and the mock does the same
          (recorded: runs/session-resume).

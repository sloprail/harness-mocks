statement: >-
  In a non-interactive run, a background command still running when the run's
  other work is done is terminated.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/headless#background-tasks-at-exit
    runs:
      - claude-mock/snapshots/runs/bgbash
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock reads a piped stdin to its end before the run starts, so the
          variant in which the grace starts only once stdin has closed is not
          modeled: its grace starts after the final result. It stays so until a
          recording drives it.
  codex:
    docs:
      - https://developers.openai.com/codex/noninteractive#when-to-use-codex-exec
    runs:
      - codex-mock/snapshots/runs/bg-bash-reaped-at-exit
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The recorded model started its command through Codex's script tool
          (exec calling exec_command), and the rollout notes the terminated
          command as a failed command item with exit code -1. The mock's one
          shell tool takes the call's yield_time_ms itself, leaves the command
          running when it passes, and terminates it at the end of the run, but
          writes no such rollout item.
  cursor:
    supported: false
    reason: cursor-agent -p waits for a background shell command to finish, delivers its task notification, and only then prints its result; it does not terminate it.
    runs:
      - cursor-mock/snapshots/runs/bg-bash-reaped-at-exit

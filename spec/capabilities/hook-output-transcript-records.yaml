statement: >-
  What hooks do leaves records in the session transcript: a silent success
  leaves nothing, while errors, blocks, cancellations and the context a hook
  adds are recorded, and each stop that ran hooks ends with a summary record.
  (Where context too long to keep goes is hook-additional-context's, and
  a stop hook that gives context without blocking is not part of this.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#exit-code-0
      - https://code.claude.com/docs/en/hooks#other-exit-codes
      - https://code.claude.com/docs/en/hooks#add-context-for-claude
    runs:
      - claude-mock/snapshots/runs/hookerrors
      - claude-mock/snapshots/runs/hookmix
      - claude-mock/snapshots/runs/stops
      - claude-mock/snapshots/runs/bgbash
      - claude-mock/snapshots/runs/hook-timeout
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#userpromptsubmit
    runs:
      - codex-mock/snapshots/runs/hook-exit-codes
      - codex-mock/snapshots/runs/hook-timeout
      - codex-mock/snapshots/runs/posttool-block
      - codex-mock/snapshots/runs/prompt-blocked
    deviations:
      - adr: capability-grounding
        statement: >-
          Codex records less than the statement says: a hook that fails
          without blocking (exit 1, a failure at SessionStart) and a hook
          stopped by its timeout leave no record, a prompt a hook blocks leaves
          no record of the reason (runs/prompt-blocked), and the end of a turn that
          ran hooks gets no summary record (recorded: runs/hook-exit-codes,
          runs/hook-timeout). What it records is the context a hook adds (a
          developer message), a block of a tool call (that call's result) and
          the reason a stop hook blocks with (a hook_prompt user message), and
          the mock records just those.
  cursor:
    supported: false
    reason: Cursor's transcript holds only user and assistant messages, so nothing a hook output, blocked, cancelled or added is recorded there.
    runs:
      - cursor-mock/snapshots/runs/hook-exit-codes
      - cursor-mock/snapshots/runs/additional-context
      - cursor-mock/snapshots/runs/hook-timeout

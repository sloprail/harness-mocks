statement: >-
  A session can be forked when resumed: the fork continues the conversation
  under a new session id in a new transcript that carries the history, and the
  original is left untouched.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/cli-reference#cli-flags
      - https://code.claude.com/docs/en/agent-sdk/sessions#fork-to-explore-alternatives
    runs:
      - claude-mock/snapshots/runs/forkresume
      - claude-mock/snapshots/runs/resume-continue-fork
    deviations:
      - adr: modeled-surface
        statement: >-
          The init frame at a session's start and the result frame that ends it,
          which in the recorded runs name the fork's new session id, are the
          scenario script's own in the mock, which writes neither (it writes an
          init frame only after a compaction). The frames the mock writes itself
          (the SessionStart hook's, a task's, a compaction's) carry the fork's id.

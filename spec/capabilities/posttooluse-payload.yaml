statement: >-
  After a tool call succeeds, a hook fires with the tool's input, its
  structured response and how long the call took. (What a particular tool's
  response contains is that tool's own capability's.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#posttooluse
      - https://code.claude.com/docs/en/hooks#posttooluse-input
    runs:
      - claude-mock/snapshots/runs/stops
      - claude-mock/snapshots/runs/hookerrors
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#posttooluse
    runs:
      - codex-mock/snapshots/runs/stops
      - codex-mock/snapshots/runs/posttool-block
  cursor:
    docs:
      - https://cursor.com/docs/hooks#posttooluse
    runs:
      - cursor-mock/snapshots/runs/file-tools
      - cursor-mock/snapshots/runs/tool-failure
      - cursor-mock/snapshots/runs/pretool-refusal
    deviations:
      - adr: modeled-surface
        statement: >-
          The mock runs the Shell, Read and Write tools only, so what the MCP tools'
          and the other tools' successful calls report to postToolUse is not modeled.

statement: >-
  When a sub-agent-stop hook blocks, the sub-agent runs again with the hook's
  reason as feedback, until the hook lets it stop or the block cap is reached.
  The feedback is recorded in the sub-agent's own transcript.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#subagentstop
      - https://code.claude.com/docs/en/hooks#subagentstop-input
      - https://code.claude.com/docs/en/hooks#decision-control
    runs:
      - claude-mock/snapshots/runs/cap-sub
      - claude-mock/snapshots/runs/hookmix
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#subagentstop
    runs:
      - codex-mock/snapshots/runs/subagent-stop-block-loop
    deviations:
      - adr: modeled-surface
        statement: The recording never reached a block cap (the hook blocked twice and then let the sub-agent stop), so the mock sets none; and a stop hook's continue:false, which the docs say outranks a block, is not read.
  cursor:
    supported: false
    reason: cursor-agent in print mode never fires the subagentStart or subagentStop hook (the run configured both, the sub-agent ran and answered), so no block is read and the sub-agent runs once.
    runs:
      - cursor-mock/snapshots/runs/subagent-stop-block-loop

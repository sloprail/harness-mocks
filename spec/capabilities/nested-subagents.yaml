statement: >-
  A sub-agent can itself dispatch sub-agents; each records its depth and its
  parent, and all of a session's sub-agent transcripts sit in one directory.
  Nesting stops at a depth limit (three layers by default, set by
  CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH), where a dispatch is an error, and in
  non-interactive mode a sub-agent does not wait for the background sub-agents
  it launched.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/sub-agents#let-subagents-spawn-their-own-subagents
    runs:
      - claude-mock/snapshots/runs/meta
      - claude-mock/snapshots/runs/nested-fork-limit
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          A fork (the fork sub-agent type, on by default in interactive
          sessions and opt-in with CLAUDE_CODE_FORK_SUBAGENT in print mode)
          inherits the whole conversation and keeps its Agent tool at the
          depth limit, where a dispatch is refused with an error. The mock
          models a fork as the recorded run shows it, run in the background
          with a sidecar of agentType fork, isFork and model inherit and
          refused at the limit with the recorded error, and does not model
          the inherited conversation or the fork-mode switch.
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#common-input-fields
    runs:
      - codex-mock/snapshots/runs/nested-subagents
      - codex-mock/snapshots/runs/nested-subagents-limit
      - codex-mock/snapshots/runs/nested-subagents-nowait
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          The statement's three layers and CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH
          are Claude Code's. Codex's depth limit is the config key
          agents.max_depth, and its default is one layer: a
          sub-agent cannot spawn its own until it is raised (recorded:
          runs/nested-subagents with 3, runs/nested-subagents-limit with 2,
          where the sub-agent at depth 2 found no spawn tool and said so). At
          the limit the tool is not offered rather than a dispatch ending in an
          error, and the mock answers a spawn_agent call there as the unknown
          tool it is ("unsupported call: spawn_agent"). Where the depth and the
          parent are recorded is the thread's own rollout meta record
          (source.subagent.thread_spawn: parent_thread_id, depth), not a
          sidecar, and all the session's rollouts, sub-agents' included, sit in
          the one day directory under sessions/.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          Recorded, the main thread spawned a sub-agent and ended the run
          without waiting for it, and `codex exec` ended with the sub-agent
          still running, aborted (runs/nested-subagents-nowait, turn_aborted);
          no recording has a sub-agent leave its own sub-agents running.
  cursor:
    docs:
      - https://cursor.com/docs/hooks#subagentstart
    runs:
      - cursor-mock/snapshots/runs/nested-subagents
      - cursor-mock/snapshots/runs/nested-subagents-depth
      - cursor-mock/snapshots/runs/nested-subagents-background
      - cursor-mock/snapshots/runs/catalogue-search-task
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Cursor records neither a sub-agent's depth nor its parent: its
          transcript is a file like the main agent's, agent-transcripts/<id>/<id>.jsonl
          beside the others of the session (the one directory, as the statement
          says), with no sidecar and no depth or parent field, and its hooks
          report its own conversation id as their session (recorded:
          runs/nested-subagents). The mock does the same.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          The statement's three layers and CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH
          are Claude Code's. Cursor's limit is two layers of sub-agents and has
          no environment variable: a sub-agent of a sub-agent is not offered the Task tool
          (it searched the tool catalogue, which answered nothing for the Task
          pattern (runs/catalogue-search-task), and said no Task tool is available,
          runs/nested-subagents-depth),
          rather than a dispatch ending in an error. The mock answers a Task
          call there as an unknown tool and nests two layers.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Cursor fires neither subagentStart nor subagentStop for a sub-agent
          or its own sub-agent in print mode, though both were configured
          (recorded: runs/nested-subagents, whose hook log has no event of
          either), so the documented parent_conversation_id of those hooks
          does not apply, and the mock fires neither.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The Await tool, which the recorded main agent used to collect the
          background sub-agent a sub-agent launched, is not implemented: the
          mock's agents are scripts, and a session simply ends when the
          background sub-agents it started are done. Recorded, the sub-agent
          ended with its own report (STARTED) while the one it launched kept
          running, and the run lasted until that one was done
          (runs/nested-subagents-background).

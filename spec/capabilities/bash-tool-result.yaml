statement: >-
  A foreground shell command's outcome is reported with what the command
  printed, and a command that exits non-zero is reported as failed with its
  exit code: as an error result for the agent, or, where the harness does not
  tell the agent so, in the run's own record of the command (a harness may
  state the exit code only when the command printed nothing). (Where a harness
  knows that exit status 1 only reports no match or a difference (a search, a
  comparison), output limits, timeouts, what a command leaves behind for the
  next one, and commands run in the background are not part of this.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/tools-reference#bash-tool-behavior
    runs:
      - claude-mock/snapshots/runs/bashfail
      - claude-mock/snapshots/runs/stops
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#posttooluse
    runs:
      - codex-mock/snapshots/runs/shell-exit-status
  cursor:
    docs:
      - https://cursor.com/docs/hooks#aftershellexecution
      - https://cursor.com/docs/hooks#posttoolusefailure
    runs:
      - cursor-mock/snapshots/runs/shell-exit-status
      - cursor-mock/snapshots/runs/tool-failure

statement: >-
  A foreground shell command's result carries its output and a structured form
  of it; a command that exits non-zero is an error result carrying what the
  command printed and reporting its exit code (a harness may state the exit
  code only when the command printed nothing). (Where a harness knows that exit status 1 only reports
  no match or a difference (a search, a comparison), output limits, timeouts,
  what a command leaves behind for the next one, and commands run in the
  background are not part of this.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/tools-reference#bash-tool-behavior
    runs:
      - claude-mock/snapshots/runs/bashfail
      - claude-mock/snapshots/runs/stops
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#posttooluse
    runs:
      - codex-mock/snapshots/runs/shell-exit-status
    deviations:
      - adr: capability-grounding
        statement: >-
          Codex does not make a failed command an error result for the agent:
          what it is told is the command's output alone, the same text a
          success would have, with no exit code stated and none marked as an
          error (recorded: runs/shell-exit-status). The failure is shown only
          in the event stream's command_execution item, whose status is
          "failed" and whose exit_code and aggregated_output carry the exit
          status and what the command printed, and the mock does the same.
  cursor:
    docs:
      - https://cursor.com/docs/hooks#aftershellexecution
      - https://cursor.com/docs/hooks#posttoolusefailure
    runs:
      - cursor-mock/snapshots/runs/shell-exit-status
      - cursor-mock/snapshots/runs/tool-failure

statement: >-
  A command hook given as a shell line runs through the shell in the event's
  working directory, with the event payload as JSON on its standard input.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#command-hook-fields
      - https://code.claude.com/docs/en/hooks#hook-input-and-output
    runs:
      - claude-mock/snapshots/runs/stops
      - claude-mock/snapshots/runs/hookerrors
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#config-shape
    runs:
      - codex-mock/snapshots/runs/stops
      - codex-mock/snapshots/runs/hook-exit-codes
      - codex-mock/snapshots/runs/hook-exit-json
      - codex-mock/snapshots/runs/hook-command-subdir
  cursor:
    docs:
      - https://cursor.com/docs/hooks#command-based-hooks
      - https://cursor.com/docs/hooks#configuration
    runs:
      - cursor-mock/snapshots/runs/hook-exit-codes
      - cursor-mock/snapshots/runs/hook-matchers
      - cursor-mock/snapshots/runs/symlinked-cwd
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock reads the project's .cursor/hooks.json only, and runs its
          hooks from the project root. The user-level hooks of
          ~/.cursor/hooks.json (which run from ~/.cursor), and the team and
          enterprise sources, are not modeled.

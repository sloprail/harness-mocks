statement: >-
  The dispatching agent receives the foreground sub-agent's final result.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/sub-agents#run-subagents-in-foreground-or-background
      - https://code.claude.com/docs/en/tools-reference#agent-tool-behavior
    runs:
      - claude-mock/snapshots/runs/meta
      - claude-mock/snapshots/runs/hookerrors
      - claude-mock/snapshots/runs/hookmix
      - claude-mock/snapshots/runs/isolated-worktree
      - claude-mock/snapshots/runs/fgsub-report-scan
      - claude-mock/snapshots/runs/fgsub-report-scan-perm
      - claude-mock/snapshots/runs/fgsub-report-scan-role
      - claude-mock/snapshots/runs/fgsub-report-scan-assistant
      - claude-mock/snapshots/runs/fgsub-tool-stats
      - claude-mock/snapshots/runs/fgsub-maxturns
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock's executor does not implement the SendMessage tool, so it does not
          model resuming a finished sub-agent (or one that stopped at its maxTurns)
          with a message: the docs and the fgsub-maxturns recording show Claude
          doing it, the resumed sub-agent carrying on in the background.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock has no model API to fail: it does not model the docs' hand-back of
          a sub-agent cut off by an API error (a rate limit, overload or server
          error), which returns the partial output with a note that it was cut off,
          or fails with 'Agent terminated early due to an API error', and which
          continues a cut-off response before ending the run.
  codex:
    docs:
      - https://developers.openai.com/codex/subagents#orchestration-and-thread-controls
    runs:
      - codex-mock/snapshots/runs/foreground-subagent-result
      - codex-mock/snapshots/runs/foreground-subagent-wait-many
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Doc and recording conflict: the orchestration-and-thread-controls
          section says "When many agents are running, Codex waits until all
          requested results are available, then returns a consolidated
          response". The recording shows a wait naming two sub-agents returned as soon as the first
          finished, telling only of it (its status map had that one entry, and the
          stream's completed wait item named only it), and the second was told of
          afterwards, as a notification of its own, which the agent answered
          (runs/foreground-subagent-wait-many). The mock does the same.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Codex does not block its parent by spawning: spawn_agent returns the
          sub-agent's id at once (its state pending), and the parent blocks in
          a call of its own, wait, which returns the sub-agent's final report
          as its result when it has finished: a status map of the sub-agent's id
          to its completion with the report as text, not a report with a
          trailer naming the sub-agent and its usage (recorded:
          runs/foreground-subagent-result). The mock does the same.
  cursor:
    docs:
      - https://cursor.com/docs/subagents#foreground-vs-background
    runs:
      - cursor-mock/snapshots/runs/foreground-subagent-result
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Cursor's result of a foreground sub-agent is the Task call's
          structured result, not a text with a trailer: the sub-agent's
          conversation steps (its final report the last), its agent id, that it
          did not run in the background and its duration; no usage is stated
          (recorded: runs/foreground-subagent-result). The mock does the same.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock runs only a foreground Task that carries a description, a
          prompt and the scenario script that plays the sub-agent; a background
          Task is not modelled. The call's args on the stream carry the sub-agent's
          description, prompt, type, model and id, not the other fields the
          recording shows (attachments, mode, environment, machine and the ids of
          the messages it answers).

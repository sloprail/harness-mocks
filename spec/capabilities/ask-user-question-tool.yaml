statement: >-
  The agent can put multiple-choice questions to the user, each with its options
  (one of them or, for a multiple-choice question, several), and is told the
  answers as the result of the call. In a run with no terminal, a PreToolUse
  hook answers: it allows the call with the questions and their answers as its
  updated input, the tool runs on that input, and the result holds it. When
  every answer is the label of an option, the agent is told that its questions
  have been answered; when any is the user's own words, it is told what the
  user answered, in neutral words that ask it to read the answers carefully.
  (A person answering in a terminal, an answer through a permission host,
  deferring the call and the timeout that closes an unanswered question are not
  part of this.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/tools-reference#askuserquestion-tool-behavior
      - https://code.claude.com/docs/en/hooks#askuserquestion
      - https://code.claude.com/docs/en/hooks#allow-with-updatedinput
    runs:
      - claude-mock/snapshots/runs/ask-user-question-tool
  codex:
    supported: false
    reason: codex exec offers request_user_input only behind an unreleased feature flag, and answers it with empty answers whatever a PreToolUse hook gives
    runs:
      - codex-mock/snapshots/runs/ask-user-question-tool
      - codex-mock/snapshots/runs/ask-user-question-tool-hook-answer
  cursor:
    supported: false
    reason: cursor-agent -p is given no question tool, so the agent has none to call
    runs:
      - cursor-mock/snapshots/runs/ask-user-question-tool

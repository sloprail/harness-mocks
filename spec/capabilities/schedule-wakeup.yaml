statement: >-
  The agent can ask to be woken after a delay with a prompt; a delay under a
  minute or over an hour is clamped to those limits, and the request is
  acknowledged with the time it is set for.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/scheduled-tasks#let-claude-choose-the-interval
    runs:
      - claude-mock/snapshots/runs/schedule-wakeup-limits
    deviations:
      - adr: modeled-surface
        statement: >-
          The mock has no clock to wait on: a valid request is acknowledged and the
          turn goes on at once, as the wake-up having fired, so the harness's
          re-invocation when the wakeup fires or a task-notification arrives, and
          the jitter the recorded wake-up times show beyond rounding up to a whole
          minute, are not modeled. A self-paced /loop (a slash command, interactive
          surface) is what Claude calls this tool for; no mock parses one.
  codex:
    supported: false
    reason: Codex exec offers the agent no wake-up or timer tool; asked to schedule one it made no tool call at all.
    runs:
      - codex-mock/snapshots/runs/schedule-wakeup-ask
  cursor:
    supported: false
    reason: Cursor's wake-up timer tool (subscribe_timer) exists only for Cloud Agents; a local agent searched for it, found none and said it has no such tool.
    runs:
      - cursor-mock/snapshots/runs/schedule-wakeup-ask

statement: >-
  A hook command's exit status classifies its outcome: accepted (0), blocked
  (2, with the hook's stderr as its message when it gave no other reason), or a
  non-blocking error (any other status, except on WorktreeCreate, where any
  non-zero status fails the creation, and except, in a harness that reads a
  hook's output whatever its status, when stdout holds valid JSON, which alone
  decides the outcome), after which the action goes on, unless the harness
  has a setting that makes a hook's failures (a non-zero status, a crash, no
  output) block the action instead. What a
  block does on each event, how accepted output is used (context, decisions,
  updated input) and hook timeouts are those events' and hook output's own
  capabilities.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#exit-code-output
      - https://code.claude.com/docs/en/hooks#exit-code-2-behavior-per-event
      - https://code.claude.com/docs/en/hooks#other-exit-codes
    runs:
      - claude-mock/snapshots/runs/hook-exit-codes
      - claude-mock/snapshots/runs/hook-exit-json
      - claude-mock/snapshots/runs/prompt-blocked
      - claude-mock/snapshots/runs/prompt-blocked-suppressed
      - claude-mock/snapshots/runs/hook-unstartable
      - claude-mock/snapshots/runs/hookerrors
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock fires SessionStart, UserPromptSubmit, PreToolUse,
          PostToolUse, PostToolUseFailure, Stop, SubagentStart, SubagentStop,
          PreCompact, PostCompact, SessionEnd, WorktreeCreate and
          WorktreeRemove, and no others. The docs' exit-code rows for StopFailure (which
          the mock defines but never fires), ConfigChange,
          CwdChanged, DirectoryAdded, Elicitation, ElicitationResult,
          FileChanged, InstructionsLoaded, MessageDisplay, Notification,
          PermissionDenied, PermissionRequest, PostModelSwitch, PostToolBatch,
          PreModelSwitch, Setup, TaskCompleted, TaskCreated, TeammateIdle and
          UserPromptExpansion are not modeled.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          A hook's JSON that fails Claude Code's output schema is a
          non-blocking error in the mock too, whose message names the failing
          field and carries the hook's own stderr, but not the full output
          schema Claude Code prints after it. Only an invalid decision gives
          Claude Code's recorded wording; any other field's complaint is the
          mock's own.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          WorktreeRemove fails on a non-zero hook exit only if the worktree's
          directory still exists afterward. The mock's worktree_remove manages
          no directory, so any non-zero exit fails it.
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#pretooluse
      - https://developers.openai.com/codex/hooks#userpromptsubmit
      - https://developers.openai.com/codex/hooks#posttooluse
      - https://developers.openai.com/codex/hooks#stop
    runs:
      - codex-mock/snapshots/runs/hook-exit-codes
      - codex-mock/snapshots/runs/hook-exit-json
      - codex-mock/snapshots/runs/hook-unstartable
      - codex-mock/snapshots/runs/prompt-blocked
      - codex-mock/snapshots/runs/posttool-block
      - codex-mock/snapshots/runs/stops
      - codex-mock/snapshots/runs/subagent-stop-block-loop
      - codex-mock/snapshots/runs/subagent-stop-continue-false
      - codex-mock/snapshots/runs/subagent-stop-plain-text
      - codex-mock/snapshots/runs/subagent-stop-exit2-continue-false
      - codex-mock/snapshots/runs/subagent-start-refused
      - codex-mock/snapshots/runs/manual-compaction-auto-blocked
      - codex-mock/snapshots/runs/manual-compaction-auto-post-stopped
      - codex-mock/snapshots/runs/session-end-hook-failure
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Codex's exit 2 uses the hook's stderr as the message even when the
          hook also printed a JSON reason: recorded, a PreToolUse hook that
          printed a deny with the reason "the JSON reason wins" and wrote "the
          stderr loses" to stderr, exiting 2, blocked the call, and the agent
          was told the stderr text; the JSON on stdout was not read
          (runs/hook-exit-json). The mock does the same.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock fires no PermissionRequest event (a non-interactive run has
          nothing to request), so the docs' exit-code row for it is not
          modeled; it fires every other event the docs give a row
          (SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, Stop,
          PreCompact, PostCompact, SubagentStart, SubagentStop, SessionEnd and
          Interrupt, which a SIGINT during a turn fires: runs/interrupt-hook).
  cursor:
    docs:
      - https://cursor.com/docs/hooks#command-based-hooks
      - https://cursor.com/docs/hooks#per-script-configuration-options
      - https://cursor.com/docs/hooks#troubleshooting
    runs:
      - cursor-mock/snapshots/runs/hook-exit-codes
      - cursor-mock/snapshots/runs/hook-fail-closed
      - cursor-mock/snapshots/runs/hook-json-nonzero
      - cursor-mock/snapshots/runs/pretool-refusal
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock fires sessionStart, sessionEnd, preToolUse, postToolUse,
          postToolUseFailure, beforeShellExecution, afterShellExecution,
          afterFileEdit and beforeReadFile, and no others. The docs' exit-code rules for the other
          permission hooks (beforeMCPExecution,
          beforeTabFileRead, subagentStart) and for afterMCPExecution,
          subagentStop, beforeSubmitPrompt, preCompact, stop,
          afterAgentResponse, afterAgentThought, the Tab hooks and
          workspaceOpen are not modeled; the recordings show cursor-agent in
          print mode firing none of beforeSubmitPrompt, afterAgentResponse and
          stop.

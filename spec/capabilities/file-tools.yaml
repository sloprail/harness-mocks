statement: >-
  The agent can read and write files in its working directory: a read returns
  the file's content, a write creates a file or replaces one whole, and a call
  that fails (a file that is not there) surfaces as an error result. (Numbered
  lines, offsets and limits, edits of an exact string, globs, images, PDFs and
  notebooks, files too large for the token limit, the rules that make a file be
  read before it is changed, and the ignore settings of a glob are not part of
  this.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/tools-reference#read-tool-behavior
      - https://code.claude.com/docs/en/tools-reference#write-tool-behavior
      - https://code.claude.com/docs/en/tools-reference#edit-tool-behavior
      - https://code.claude.com/docs/en/tools-reference#glob-tool-behavior
    runs:
      - claude-mock/snapshots/runs/file-tools
      - claude-mock/snapshots/runs/tool-errors
  codex:
    docs:
      - https://developers.openai.com/api/docs/guides/tools-apply-patch#apply-patch-operations
    runs:
      - codex-mock/snapshots/runs/file-tools
      - codex-mock/snapshots/runs/file-tools-failure
    deviations:
      - adr: capability-grounding
        statement: >-
          Codex has no tool to read a file and none to write one whole: the
          agent reads through the shell (sed, cat), which returns the file's
          content, and writes with apply_patch, whose "Add File" creates a file
          and whose "Update File" changes the lines a hunk names, the way the
          recorded run replaced a file's one line (recorded: runs/file-tools).
          A shell read of a file that is not there is not an error result: the
          agent is told the shell's complaint as plain output, and only the
          event stream's command_execution item shows the failure, with status
          "failed" and exit code 1 (recorded: runs/file-tools-failure). A patch
          that updates a missing file is an error told to the agent, and writes
          nothing.
      - adr: modeled-surface
        statement: >-
          The mock applies the three file sections of a patch (Add File, Update
          File with its hunks, Delete File) and no more: it does not model
          moving a file, the end-of-file marker, a patch's context-matching
          leniency or a patch given through the shell; and it fires PreToolUse
          and PostToolUse for a patch that fails, as it does for one that
          succeeds, whereas the recorded failing patch (made through Codex's
          code-mode wrapper) fired no hook.
  cursor:
    docs:
      - https://cursor.com/docs/hooks#afterfileedit
      - https://cursor.com/docs/hooks#beforereadfile
    runs:
      - cursor-mock/snapshots/runs/file-tools
      - cursor-mock/snapshots/runs/tool-failure
    deviations:
      - adr: modeled-surface
        statement: >-
          Cursor fires a beforeReadFile hook on each Read, carrying the file's
          path and content (recorded in runs/file-tools); the mock does not
          fire it, as it models neither beforeReadFile nor the refusal a hook
          of it can make, so only the read's result, afterFileEdit and the
          failure of a missing file are modeled.

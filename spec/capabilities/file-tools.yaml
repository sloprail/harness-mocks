statement: >-
  The agent can read, write, edit and glob files in its working directory. A
  read returns the file's lines, numbered from line 1, starting at an offset
  for a limit; a write creates a file or replaces one whole; an edit replaces
  an exact string that appears exactly once (or every occurrence, when asked)
  and is refused before any hook runs when the string is absent or ambiguous;
  a glob lists the files that match, sorted by modification time, at most a
  hundred of them; a call that fails surfaces as an error result. (What a
  read does with images, PDFs and notebooks, with a file too large for the
  token limit, the rules that make a file be read before it is changed, and
  the ignore settings of a glob are not part of this.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/tools-reference#read-tool-behavior
      - https://code.claude.com/docs/en/tools-reference#write-tool-behavior
      - https://code.claude.com/docs/en/tools-reference#edit-tool-behavior
      - https://code.claude.com/docs/en/tools-reference#glob-tool-behavior
    runs:
      - claude-mock/snapshots/runs/file-tools
      - claude-mock/snapshots/runs/tool-errors
  codex: false

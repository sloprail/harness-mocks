statement: >-
  A sub-agent's records go to its own transcript file beside the session's,
  not into the session's, together with a sidecar naming its type, the call
  that spawned it and its depth.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/claude-directory#application-data
      - https://code.claude.com/docs/en/sub-agents#resume-subagents
    runs:
      - claude-mock/snapshots/runs/meta
      - claude-mock/snapshots/runs/hookerrors
      - claude-mock/snapshots/runs/bgagent
      - claude-mock/snapshots/runs/transcript-retention
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The sub-agents doc describes resuming a finished sub-agent by
          messaging it (SendMessage), which continues the same transcript file.
          The mock does not model SendMessage or sub-agent resume: a sub-agent
          runs once, writes its one file and sidecar, and is not continued.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          The docs say sub-agent transcripts are deleted with their session once
          it is older than cleanupPeriodDays. In the recorded print-mode run, a
          session of another project 63 days old with its sub-agent file and
          sidecar, and cleanupPeriodDays set to 30, was left whole when the run
          ended: the real harness did not sweep within the run, and the mock
          has no sweep either.
  codex:
    docs:
      - https://developers.openai.com/codex/subagents#core-terms
    runs:
      - codex-mock/snapshots/runs/subagent-transcripts-v2
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Codex keeps no sidecar file: the sub-agent's rollout is a file beside
          the session's (same day directory, named by the sub-agent's own thread
          id) and its first record says what a sidecar would, as the thread that
          spawned it (parent_thread_id) and its depth. It names no call that
          spawned it and no type beyond a role that was null in the recording,
          and its path in the tree of agents is null too (recorded:
          runs/subagent-transcripts-v2). The mock does the same.
  cursor:
    docs:
      - https://cursor.com/docs/subagents#how-subagents-work
    runs:
      - cursor-mock/snapshots/runs/subagent-transcripts
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Cursor keeps no sidecar: nothing names the sub-agent's type, the call
          that spawned it or its depth. Its transcript is a conversation of its
          own under agent-transcripts, in a directory named by its own id next
          to the session's, and the only link is the Task call's completed
          frame on the stream, which gives that id as the result's agentId
          (recorded: runs/subagent-transcripts). The mock does the same.
      - adr: modeled-surface
        kind: harness-lacks
        statement: >-
          The subagentStart and subagentStop hooks are not fired for the
          sub-agent.

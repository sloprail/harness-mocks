statement: >-
  The agent can launch a skill of the project by name: the call is answered
  that the skill is launching, and the skill's instructions (its file without
  the front matter, with the arguments the call gave after them) are put before
  the agent as a message of their own. A skill that is not there is an error
  result. (Skills of the user and of plugins, the substitution of argument
  placeholders, skills that run in a sub-agent and the permissions a skill
  grants are not part of this.)

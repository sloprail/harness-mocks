statement: >-
  The agent can launch a skill of the project by name: the call is answered
  that the skill is launching, and the skill's instructions (its file without
  the front matter, with the arguments the call gave after them) are put before
  the agent as a message of their own. A skill that is not there is an error
  result. (Skills of the user and of plugins, the substitution of argument
  placeholders, skills that run in a sub-agent and the permissions a skill
  grants are not part of this.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/skills#pass-arguments-to-skills
      - https://code.claude.com/docs/en/skills#skill-content-lifecycle
    runs:
      - claude-mock/snapshots/runs/skill-tool
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Doc and recording conflict: the skills page, section "Skill content
          lifecycle", says "When Claude re-invokes a skill whose rendered
          content is identical to the copy already in context, Claude Code adds
          a short note that the skill is already loaded rather than a second
          copy of the content." The recording shows claude 2.1.285 giving, for
          a launch of a skill launched before, a notice ("(Re-invocation of
          /greet — the skill instructions were previously loaded; the arguments
          or dynamic output below are new.)") and then the instructions in full
          again, whether the arguments changed or the very same call was made
          (recorded: runs/skill-tool, steps 3 and 4).
  codex:
    supported: false
    reason: Codex exec has no tool that launches a skill. It lists the skills it finds (.agents/skills) to the agent in a developer message and the agent is meant to read a skill's SKILL.md itself; asked to launch the greet skill with its own skill-launching tool it said it has no such tool and made no call.
    docs:
      - https://developers.openai.com/codex/skills#how-codex-uses-skills
    runs:
      - codex-mock/snapshots/runs/skill-tool-ask
  cursor:
    supported: false
    reason: Cursor's agent has no tool that launches a skill (skills are picked by the agent from the list it is given, or by the user with a slash command); asked to launch the greet skill with its own skill-launching tool it searched its tools for one, found none, made no skill call and said it has no such tool.
    docs:
      - https://cursor.com/docs/skills#how-skills-work
    runs:
      - cursor-mock/snapshots/runs/skill-tool-ask

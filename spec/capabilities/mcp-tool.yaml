statement: >-
  A tool of an MCP server the session is configured with is called by the
  agent under the name mcp__<server>__<tool>, with the arguments the server's
  tool takes. Hooks see the call under that name, with the tool's input, the
  server it comes from, and its result: the text blocks the server returned. A
  result the server marks as an error is given to the agent as that error's
  text alone, and fires the failure hook. (Where no server can be run, a mock
  answers a call with the result the test gives that call, in the shape of an
  MCP tool result, text blocks and whether it is an error. The server's own
  start, its tool list and schemas, and results other than text, such as an
  image, are not part of this.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#match-mcp-tools
      - https://code.claude.com/docs/en/mcp
    runs:
      - claude-mock/snapshots/runs/mcp-tool

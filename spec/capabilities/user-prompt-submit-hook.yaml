statement: >-
  A hook fires before a submitted prompt reaches the agent. It can add context
  to the prompt or refuse it, but it cannot rewrite it. It also fires for a
  background-task notification handed to the agent. (What an exit status
  means is hook-exit-code-semantics', and how added context is kept is
  hook-additional-context's.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#userpromptsubmit-input
      - https://code.claude.com/docs/en/hooks#userpromptsubmit-decision-control
      - https://code.claude.com/docs/en/hooks#what-a-blocked-prompt-leaves-behind
    runs:
      - claude-mock/snapshots/runs/hookerrors
      - claude-mock/snapshots/runs/prompt-blocked
      - claude-mock/snapshots/runs/prompt-blocked-json
      - claude-mock/snapshots/runs/midturn
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#userpromptsubmit
    runs:
      - codex-mock/snapshots/runs/hook-exit-codes
      - codex-mock/snapshots/runs/prompt-blocked
      - codex-mock/snapshots/runs/user-prompt-submit-hook-rewrite
      - codex-mock/snapshots/runs/user-prompt-submit-hook-bg
      - codex-mock/snapshots/runs/user-prompt-submit-hook-json-block
      - codex-mock/snapshots/runs/user-prompt-submit-json-context
      - codex-mock/snapshots/runs/hook-matchers
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Codex does not hand a background-task notification to the agent, so
          its UserPromptSubmit hook does not fire for one: recorded, the hook
          fired once, for the submitted prompt, in a run whose agent started a
          background command and ended its turn with nothing handed back
          (runs/user-prompt-submit-hook-bg, runs/task-notifications-bg). The
          mock does the same.
  cursor:
    docs:
      - https://cursor.com/docs/hooks#beforesubmitprompt
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          In print mode cursor-agent never fires a configured beforeSubmitPrompt
          hook: one that tries to refuse the prompt is not run and the prompt
          reaches the agent, which acts on it (runs/user-prompt-submit-hook,
          runs/hook-exit-codes). Only the TUI fires it, before the agent runs, and
          a hook answering continue false refuses the prompt (runs/tui-prompt-blocked,
          which the mock models).
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          No recording shows the hook adding context to the prompt, or firing for
          a background-task notification handed to the agent, so those parts of the
          statement are not shown.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          No recording tries to rewrite the prompt (no beforeSubmitPrompt hook
          returned a changed prompt), so that the hook cannot rewrite it is not
          shown for Cursor; the mock gives a hook no way to.
    runs:
      - cursor-mock/snapshots/runs/user-prompt-submit-hook
      - cursor-mock/snapshots/runs/hook-exit-codes
      - cursor-mock/snapshots/runs/tui-prompt-blocked

statement: >-
  A single prompt can be run to completion without interaction, streaming one
  machine-readable event per record and ending with one result.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/cli-reference#cli-flags
      - https://code.claude.com/docs/en/headless#basic-usage
      - https://code.claude.com/docs/en/headless#stream-responses
    runs:
      - claude-mock/snapshots/runs/stops
      - claude-mock/snapshots/runs/bashfail
      - claude-mock/snapshots/runs/run-failure
      - claude-mock/snapshots/runs/max-turns
      - claude-mock/snapshots/runs/include-hook-events
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock refuses --output-format text and json, piped stdin and
          --include-partial-messages (adr fail-fast-unimplemented): only
          stream-json is produced, from the scenario's own script. It does not
          model the SIGTERM exit code 143. All of these stay so until a
          recording drives them.
  codex:
    docs:
      - https://developers.openai.com/codex/noninteractive#basic-usage
      - https://developers.openai.com/codex/noninteractive#make-output-machine-readable
    runs:
      - codex-mock/snapshots/runs/stops
      - codex-mock/snapshots/runs/hook-exit-codes
      - codex-mock/snapshots/runs/prompt-blocked
      - codex-mock/snapshots/runs/noninteractive-run-text-output
      - codex-mock/snapshots/runs/noninteractive-run-git-check-refused
      - codex-mock/snapshots/runs/noninteractive-run-no-git-check
      - codex-mock/snapshots/runs/noninteractive-run-output-schema
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock refuses -o/--output-last-message, --output-schema,
          --ignore-user-config, --ignore-rules, the deprecated --full-auto and
          the other flags it implements nothing of (adr fail-fast-unimplemented):
          it has no model, so the final message is the scenario's own, not
          shaped by a schema (the real run's message conforms to it and the
          stream is otherwise unchanged, as recorded in
          runs/noninteractive-run-output-schema), and no file is written. The
          refusal of a run outside a git repository (runs/noninteractive-run-git-check-refused,
          lifted by --skip-git-repo-check or by bypassing the sandbox,
          runs/noninteractive-run-no-git-check) is modeled; a directory trusted
          through the user's configuration is not. It calls no model and
          has no failing turn or stream failure, so the turn.failed event and
          the stream-level error event the docs name are not modeled. The
          stream's item types are the agent message and the command execution
          only: reasoning, file changes, MCP tool calls, web searches and plan
          updates are not modeled.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          Without --json the mock prints Codex's progress on stderr (banner with
          release, directory, model and session; the prompt; the notices; each
          command with how it ended and what it printed; the agent's message;
          the tokens used, always 0), as recorded in
          runs/noninteractive-run-text-output. It does not print the banner's
          provider, approval, sandbox and reasoning lines, which are
          configuration the mock does not have, the stdin notice, or a line per
          hook run.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock refuses --ephemeral (it always writes the session's rollout
          file), and reads no piped stdin: a
          prompt argument plus piped input is not combined as additional
          context, and `codex exec -` (stdin as the prompt) is not modeled.
          `codex exec resume --last` is refused as well: only a session named
          by its id resumes.
  cursor:
    docs:
      - https://cursor.com/docs/cli/headless#how-it-works
      - https://cursor.com/docs/cli/headless#real-time-progress-tracking
    runs:
      - cursor-mock/snapshots/runs/pretool-refusal
      - cursor-mock/snapshots/runs/noninteractive-no-force
      - cursor-mock/snapshots/runs/noninteractive-force-write
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Doc and recording conflict: the headless doc (#how-it-works) says
          "Without --force, changes are only proposed, not applied", and the
          recording shows a file write applied without --force
          (runs/noninteractive-no-force). The recording decides.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          Without --force or --yolo the mock rejects every shell command, run
          unprompted, and applies every file write, the two outcomes recorded
          for a command and a write (the headless doc's file changes that are
          only proposed were not what the recording shows). Which other
          commands cursor-agent would run without being asked (an allowlist,
          read-only commands) is not modeled, nor a background command's
          rejection, which is the same as any other command's.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The recorded streams (runs/pretool-refusal, runs/noninteractive-no-force)
          carry thinking frames: "delta" frames with a piece of the model's
          reasoning text, closed by a "completed" frame, each with a session id
          and timestamp, and assistant frames with the model's text. They are
          the model's own words; the mock calls no model and no script can
          produce thinking frames, so it emits none. It prints an assistant frame
          only for text a script gives it, and the replay scripts give none. Its
          stream is the system init, the prompt, the tool-call frames and the
          result, the recorded sequence without its thinking and assistant frames.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock models only the stream-json output format. The docs' default
          text format (the final answer only), the json format and
          --stream-partial-output (partial assistant text deltas as the agent
          writes) are not modeled: another --output-format is refused, and
          --stream-partial-output is accepted and ignored.

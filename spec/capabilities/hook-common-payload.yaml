statement: >-
  Every lifecycle hook receives a payload naming the session, its transcript
  file and its working directory. An event raised inside a sub-agent also
  names that sub-agent, while events on the main thread name none.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#common-input-fields
    runs:
      - claude-mock/snapshots/runs/hookmix
      - claude-mock/snapshots/runs/stops
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#common-input-fields
    runs:
      - codex-mock/snapshots/runs/stops
      - codex-mock/snapshots/runs/hook-matchers
      - codex-mock/snapshots/runs/session-end
      - codex-mock/snapshots/runs/ephemeral-no-transcript
      - codex-mock/snapshots/runs/background-agent
  cursor:
    docs:
      - https://cursor.com/docs/hooks#common-schema
    runs:
      - cursor-mock/snapshots/runs/tool-failure
      - cursor-mock/snapshots/runs/pretool-refusal
      - cursor-mock/snapshots/runs/file-tools
      - cursor-mock/snapshots/runs/subagent-lifecycle-hooks
      - cursor-mock/snapshots/runs/multiroot-workspace
      - cursor-mock/snapshots/runs/add-dir-access
      - cursor-mock/snapshots/runs/no-add-dir-access
      - cursor-mock/snapshots/runs/workspace-open
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Cursor does not name the working directory as a cwd on every
          payload: it names it as workspace_roots (the project's roots) on
          every event, and a cwd field (recorded empty, the command having run
          from the project root) is carried only by the events of a Shell call
          (beforeShellExecution, and preToolUse, postToolUse and
          postToolUseFailure of the Shell tool), not by a Read, Write or Task
          call's or any other event. Its transcript path is null at
          sessionStart and in the first events, until the conversation's
          transcript file exists. The mock does the same (recorded:
          runs/tool-failure, runs/file-tools, runs/pretool-refusal).
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Doc and recording conflict: the hooks doc (#common-schema) says
          transcript_path is the "Path to the main conversation transcript
          file", and the recording shows the Shell postToolUse of a sub-agent
          carrying the sub-agent's own transcript path
          (agent-transcripts/0965d081-.../0965d081-....jsonl, its own session
          id, not the main agent's) (runs/subagent-lifecycle-hooks). The
          recording decides.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Cursor names a sub-agent on an event raised inside it by that
          event's own session_id, conversation_id and (once its transcript
          file exists) transcript_path: the sub-agent's, not the main agent's,
          as in a Shell call's preToolUse and postToolUse payloads. No field
          carries the sub-agent's type or its parent on the events of its own
          calls. The main agent's events carry a session_id and conversation_id
          too, so the events of a sub-agent are told from them only by those
          ids differing: no event says it was raised inside a sub-agent
          (recorded: runs/subagent-lifecycle-hooks). The mock does the same.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Doc and recording conflict: the hooks doc (its event list, #subagentstart,
          #subagentstop) lists "subagentStart / subagentStop - Subagent (Task
          tool) lifecycle" events, subagentStart carrying subagent_type and
          parent_conversation_id and subagentStop carrying subagent_type and
          agent_transcript_path, and the recording shows neither firing for the
          Task call in print mode, though the run's hooks.json registers both
          (runs/subagent-lifecycle-hooks). The recording decides.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Doc and recording conflict: the hooks doc (its event list) says
          "preToolUse / postToolUse / postToolUseFailure - Generic tool use hooks
          (fires for all tools)", and the recording shows the Task call raising
          preToolUse only, no postToolUse, though the run's hooks.json registers
          postToolUse (runs/subagent-lifecycle-hooks). The recording decides.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock has no setting that disables transcripts (which makes the
          transcript path null throughout), so that variant of the common schema
          is not modeled.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Doc and recording conflict: the hooks doc (#common-schema) says
          transcript_path is "Path to the main conversation transcript file
          (null if transcripts disabled)", and the recordings show it null at
          sessionStart and on the first preToolUse with transcripts on
          (recorded: runs/tool-failure, runs/symlinked-cwd,
          runs/file-tools). The recordings decide.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Cursor in print mode does not run a multiroot workspace: the common
          schema (#common-schema) says workspace_roots lists every root folder
          ("multiroot workspaces can have multiple"), and a run with a second
          root added with --add-dir, and one started from a workspace file,
          still named one root in every payload (recorded:
          runs/multiroot-workspace, runs/add-dir-access; --workspace takes a
          directory, not a workspace file). The mock names the one root.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Cursor's payloads carry model_id and model_params (the common schema's
          optional fields) only on one hook that reports what the agent
          did between calls, which the mock does not fire, and on no other event of any recording: the events the mock
          fires carry model "default" and neither field (recorded:
          runs/file-tools, runs/hook-exit-codes, runs/background-agent and the
          other runs).

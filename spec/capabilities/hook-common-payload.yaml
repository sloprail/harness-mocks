statement: >-
  Every lifecycle hook receives a payload naming the session, its transcript
  file and its working directory. An event raised inside a sub-agent also
  names that sub-agent, while events on the main thread name none.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#common-input-fields
    runs:
      - claude-mock/snapshots/runs/hookmix
      - claude-mock/snapshots/runs/stops
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#common-input-fields
    runs:
      - codex-mock/snapshots/runs/stops
      - codex-mock/snapshots/runs/hook-matchers
      - codex-mock/snapshots/runs/session-end
      - codex-mock/snapshots/runs/ephemeral-no-transcript
      - codex-mock/snapshots/runs/background-agent
  cursor:
    docs:
      - https://cursor.com/docs/hooks#common-schema
    runs:
      - cursor-mock/snapshots/runs/tool-failure
      - cursor-mock/snapshots/runs/pretool-refusal
      - cursor-mock/snapshots/runs/file-tools
      - cursor-mock/snapshots/runs/subagent-lifecycle-hooks
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Cursor does not name the working directory as a cwd on every
          payload: it names it as workspace_roots (the project's roots) on
          every event, and a cwd field (recorded empty, the command having run
          from the project root) is carried only by the events of a Shell call
          (beforeShellExecution, and preToolUse, postToolUse and
          postToolUseFailure of the Shell tool), not by a Read, Write or Task
          call's or any other event. Its transcript path is null at
          sessionStart and in the first events, until the conversation's
          transcript file exists. The mock does the same (recorded:
          runs/tool-failure, runs/file-tools, runs/pretool-refusal).
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Doc and recording conflict: the hooks doc (#common-schema) says
          transcript_path is the "Path to the main conversation transcript
          file", and the recording shows the Shell postToolUse of a sub-agent
          carrying the sub-agent's own transcript path
          (agent-transcripts/0965d081-.../0965d081-....jsonl, its own session
          id, not the main agent's) (runs/subagent-lifecycle-hooks). The
          recording decides.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Cursor names a sub-agent on an event raised inside it by that
          event's own session_id, conversation_id and (once its transcript
          file exists) transcript_path: the sub-agent's, not the main agent's,
          as in a Shell call's preToolUse and postToolUse payloads. No field
          carries the sub-agent's type or its parent, and in print mode neither
          subagentStart nor subagentStop fires for the Task call (recorded:
          runs/subagent-lifecycle-hooks). The mock does the same.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock fires no workspaceOpen event (an app-lifecycle event outside
          any session, whose payload omits the conversation id, the session id
          and the transcript path) and has no setting that disables
          transcripts (which makes the transcript path null throughout), so
          those two variants of the common schema are not modeled.

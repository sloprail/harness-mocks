statement: >-
  A machine-readable run stream tells when each background task and sub-agent
  starts and when it ends: by frames of their own, or by the frames of the
  call that launched it and of what reports its end.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/agent-sdk/typescript#sdktaskstartedmessage
      - https://code.claude.com/docs/en/agent-sdk/typescript#sdktaskupdatedmessage
      - https://code.claude.com/docs/en/agent-sdk/typescript#sdktasknotificationmessage
    runs:
      - claude-mock/snapshots/runs/bgbash
      - claude-mock/snapshots/runs/midturn
      - claude-mock/snapshots/runs/bgagent
      - claude-mock/snapshots/runs/meta
      - claude-mock/snapshots/runs/hookerrors
      - claude-mock/snapshots/runs/cap-sub
  codex:
    docs:
      - https://developers.openai.com/codex/noninteractive#make-output-machine-readable
    runs:
      - codex-mock/snapshots/runs/task-stream-frames
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock runs no model: a sub-agent's work is the scenario script
          the spawn_agent call names, and the mock waits for it inside that
          call, showing the wait item right after the spawn's. A separate
          wait call, and a sub-agent running while the agent does something
          else, are not modelled.
  cursor:
    docs:
      - https://cursor.com/docs/cli/headless#real-time-progress-tracking
    runs:
      - cursor-mock/snapshots/runs/task-stream-frames
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock runs no sub-agent, so a Task call is answered as an error
          rather than with the sub-agent's reply, and it has no await tool: the
          notification frame of a background command follows the end of the
          turn it ran in (as runs/task-notifications-bg shows), where the
          recording's follows the await the agent made.

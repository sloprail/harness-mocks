statement: >-
  A machine-readable run stream announces each background task and sub-agent
  when it starts, updates its status, and reports its end with a notification.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/agent-sdk/typescript#sdktaskstartedmessage
      - https://code.claude.com/docs/en/agent-sdk/typescript#sdktaskupdatedmessage
      - https://code.claude.com/docs/en/agent-sdk/typescript#sdktasknotificationmessage
    runs:
      - claude-mock/snapshots/runs/bgbash
      - claude-mock/snapshots/runs/midturn
      - claude-mock/snapshots/runs/bgagent
      - claude-mock/snapshots/runs/meta
      - claude-mock/snapshots/runs/hookerrors
      - claude-mock/snapshots/runs/cap-sub
  codex:
    supported: false
    reason: >-
      Codex's event stream has no task frames: no start, update or notification
      frame, a shell command is never a task, and a sub-agent is announced only by
      the collab_tool_call item of its spawn call and told ended by the item
      completing a wait on it.
    docs:
      - https://developers.openai.com/codex/noninteractive#make-output-machine-readable
    runs:
      - codex-mock/snapshots/runs/task-stream-frames
  cursor:
    supported: false
    reason: >-
      Cursor's stream-json has no task_started or task_updated frame: a sub-agent
      and a background command are announced by the tool_call frames of the call
      that launched them, and only a background command's end is a frame of its
      own (task_notification); a sub-agent has none.
    docs:
      - https://cursor.com/docs/cli/headless#real-time-progress-tracking
    runs:
      - cursor-mock/snapshots/runs/task-stream-frames
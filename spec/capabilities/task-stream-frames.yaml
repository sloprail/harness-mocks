statement: >-
  A machine-readable run stream tells when each background task and sub-agent
  starts and when it ends: by frames of their own, or by the frames of the
  call that launched it and of what reports its end.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/agent-sdk/typescript#sdktaskstartedmessage
      - https://code.claude.com/docs/en/agent-sdk/typescript#sdktaskupdatedmessage
      - https://code.claude.com/docs/en/agent-sdk/typescript#sdktasknotificationmessage
    runs:
      - claude-mock/snapshots/runs/bgbash
      - claude-mock/snapshots/runs/bgbash-failed
      - claude-mock/snapshots/runs/midturn
      - claude-mock/snapshots/runs/bgagent
      - claude-mock/snapshots/runs/meta
      - claude-mock/snapshots/runs/hookerrors
      - claude-mock/snapshots/runs/cap-sub
      - claude-mock/snapshots/runs/bash-long-foreground
      - claude-mock/snapshots/runs/bash-short-foreground
      - claude-mock/snapshots/runs/hook-timeout
  codex:
    docs:
      - https://developers.openai.com/codex/noninteractive#make-output-machine-readable
    runs:
      - codex-mock/snapshots/runs/task-stream-frames
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Codex's stream has no frame for a background task starting or
          ending: the sub-agent is shown by the items of the spawn_agent and
          wait calls, and a shell command asked to run detached runs as an
          ordinary command_execution item that starts and completes, exit code
          0 (recorded: runs/task-stream-frames, item_4 for
          `sh -c 'sleep 5; echo BGDONE'`). The doc lists only generic item.*
          events and command executions.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock runs no model: a sub-agent's work is the scenario script
          the spawn_agent call names.
  cursor:
    docs:
      - https://cursor.com/docs/cli/headless#real-time-progress-tracking
    runs:
      - cursor-mock/snapshots/runs/task-stream-frames
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock has no await tool: the notification frame of a background
          command follows the end of the turn it ran in (as
          runs/task-notifications-bg shows), where the recording's follows the
          await the agent made.

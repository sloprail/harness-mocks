statement: >-
  When a tool that ran fails (a command exiting non-zero, a file tool's
  error), a failure hook fires instead of the success
  hook, carrying an error message, whether it was an interrupt, and how long
  the call took.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#posttoolusefailure
      - https://code.claude.com/docs/en/hooks#posttoolusefailure-input
    runs:
      - claude-mock/snapshots/runs/bashfail
      - claude-mock/snapshots/runs/tool-errors
      - claude-mock/snapshots/runs/tool-invalid-input
      - claude-mock/snapshots/runs/stops
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock never aborts a running tool, so an interrupt
          (is_interrupt true) is not modeled, nor are the truncation marker
          and timeout lines Claude Code adds to a long or timed-out command's
          error. Only a missing file's
          Read error is worded as Claude Code words it; other file tools'
          errors are the mock's own text.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          A Bash whose shell cannot start (a bare failure message with no
          "Exit code N" line) is not modeled: the mock's Bash always runs
          /bin/sh, and Claude Code falls back to another shell when
          CLAUDE_CODE_SHELL names one that does not work, so neither side
          can produce it. Of input validation, only a missing required
          parameter is modeled; a parameter of the wrong type or an unknown
          tool name is not.
  codex:
    supported: false
    reason: Codex's hook events list has no tool-failure event; PostToolUse is its only after-tool event.
    docs:
      - https://developers.openai.com/codex/hooks#hooks
  cursor:
    docs:
      - https://cursor.com/docs/hooks#posttoolusefailure
      - https://cursor.com/docs/hooks#posttooluse
    runs:
      - cursor-mock/snapshots/runs/tool-failure
      - cursor-mock/snapshots/runs/file-tools
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock runs the Shell, Read and Write tools only, and never aborts
          a running tool, so the failures of the other tools (MCP tools, Delete,
          Grep, Task), a timeout (failure_type "timeout") and an interrupt
          (is_interrupt true) are not modeled.

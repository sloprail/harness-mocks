statement: >-
  A compaction leaves in the transcript what a reader needs to follow the
  record chain across it: a boundary followed by a summary and a preserved
  tail of earlier records, or a chain the harness keeps of its own.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/claude-directory#application-data
    runs:
      - claude-mock/snapshots/runs/compact
      - claude-mock/snapshots/runs/compact-nohooks
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#precompact
    runs:
      - codex-mock/snapshots/runs/compaction-transcript-continuity
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The rollout only grows across a compaction, as recorded: what came
          before stays in the file, and the session, the turn and the
          transcript path are the same before and after. The mock writes what
          Codex writes around it (the compacted record with its retained
          context, resume metadata and response id, then the turn's context
          and the thread's settings), but keeps only the last user message as
          the kept message, without the developer and environment messages
          Codex's replacement history opens with (the mock's rollout has none
          at its start), writes a placeholder for the encrypted summary, zeros
          for the token usage, and leaves out the model's hash and reasoning
          effort. It compacts when a scenario's compact record asks for it, not
          at a context limit, as in the manual-compaction cell.
  cursor:
    supported: false
    reason: >-
      A cursor-agent -p run that compacted twice (preCompact fired at lines 65 and
      111 of its events, trigger "auto") left in its transcript no boundary record
      and no summary: after each compaction the transcript carries the user prompt
      again, byte-identical to the first record and so no marker that a compaction
      happened, and the records written after it are new tool calls, not an
      account of the dropped ones; the one other new record, ahead of the
      second re-written prompt, is a `<dynamic_tools>` tool-discovery message,
      which is not a summary. Its records hold only role and message (plus a
      final turn_ended status line), so no record links to another and the
      harness keeps no chain of its own. Nothing is lost either: in the TUI's
      /compress (runs/tui-manual-compaction) every conversation record the
      transcript held at preCompact was still, byte for byte, the start of the
      same file when the session ended (no prompt is written again there, and
      the turn_ended line moves behind what follows), and the session id, the
      conversation id and the transcript path (once it is named, from the first
      response) were the same in every payload before and after; only the generation_id differs, as each compaction is a
      generation of its own.
    docs:
      - https://cursor.com/docs/hooks#precompact
    runs:
      - cursor-mock/snapshots/runs/compaction-transcript-continuity
      - cursor-mock/snapshots/runs/tui-manual-compaction

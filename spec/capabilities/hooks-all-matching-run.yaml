statement: >-
  Every hook that matches an event runs, all together, even when one of them
  blocks; when several block, the harness acts on the one that finishes last or
  merges them. The same hook configured in several settings files runs once,
  in a harness that reads more than one. (How the decisions and the context of
  several hooks combine is each decision's and context's own capability.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#hook-handler-fields
      - https://code.claude.com/docs/en/hooks-guide#combine-results-from-multiple-hooks
    runs:
      - claude-mock/snapshots/runs/all-hooks
      - claude-mock/snapshots/runs/all-hooks-slow-first
      - claude-mock/snapshots/runs/all-hooks-close-second
      - claude-mock/snapshots/runs/all-hooks-close-first
      - claude-mock/snapshots/runs/hook-two-settings-files
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#where-codex-looks-for-hooks
      - https://developers.openai.com/codex/hooks#pretooluse
    runs:
      - codex-mock/snapshots/runs/pretool-decisions
      - codex-mock/snapshots/runs/hooks-all-matching-run-blockers-slow-first
      - codex-mock/snapshots/runs/hooks-all-matching-run-blockers-fast-first
      - codex-mock/snapshots/runs/hooks-all-matching-run-same-hook-two-files
      - codex-mock/snapshots/runs/hook-trust-untrusted
      - codex-mock/snapshots/runs/hook-trust-config
      - codex-mock/snapshots/runs/project-hooks-trust-workspace-write
      - codex-mock/snapshots/runs/project-hooks-trust-read-only
      - codex-mock/snapshots/runs/project-hooks-trust-no-sandbox
      - codex-mock/snapshots/runs/disable-hooks
      - codex-mock/snapshots/runs/ignore-user-config
      - codex-mock/snapshots/runs/ignore-user-config-bypass
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Codex runs a matching hook only when it is trusted, and skips an
          untrusted one without a word (recorded: runs/hook-trust-untrusted).
          A hook is trusted when its hash is the trusted_hash of its key in
          config.toml (recorded: runs/hook-trust-config, where a stale hash
          leaves the project's hook out) or the run passes
          --dangerously-bypass-hook-trust. The project layer's hooks.json
          loads only in a trusted project: one the run's sandbox trusts
          (workspace-write, danger-full-access, the bypass of the sandbox),
          not a read-only run or one that names none (recorded:
          runs/project-hooks-trust-workspace-write, -read-only, -no-sandbox).
          --disable hooks loads no hook (runs/disable-hooks), and
          --ignore-user-config leaves config.toml unread, its trust with it,
          while the user layer's hooks.json still loads
          (runs/ignore-user-config, runs/ignore-user-config-bypass). The mock
          does the same.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          When several hooks block one call, Codex acts on neither the one that
          finishes last nor a merge: it acts on the first in configuration
          order, whichever finishes first, after all of them have run to
          completion (recorded: a slow and a fast hook that both deny, in
          either order, and the reason told is the first configured's), and the
          mock does the same.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Codex does not run a hook configured in several settings files once:
          the same command in the user layer's and the project layer's
          hooks.json runs once per file, twice in all (recorded:
          runs/hooks-all-matching-run-same-hook-two-files), and the mock does
          the same.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock reads hooks only from the user's and the project's
          hooks.json: the inline [hooks] tables of config.toml (user and
          project), plugin-bundled hooks and managed hooks, which Codex also
          loads and runs beside them, are not modeled.
  cursor:
    docs:
      - https://cursor.com/docs/hooks#configuration
    runs:
      - cursor-mock/snapshots/runs/hooks-together
      - cursor-mock/snapshots/runs/pretool-refusal
      - cursor-mock/snapshots/runs/pretool-refusal-combined
      - cursor-mock/snapshots/runs/hooks-all-matching-run-same-hook-two-sources
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Cursor does not run a hook configured in several sources once: the
          same command in the user's ~/.cursor/hooks.json and the project's
          .cursor/hooks.json ran once per source, twice in all (recorded:
          runs/hooks-all-matching-run-same-hook-two-sources), as the docs say
          all matching hooks from every source run. The mock reads the
          project source and the user's, and runs such a hook once per source.
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock reads the project's .cursor/hooks.json and the user's
          ~/.cursor/hooks.json: the team and enterprise sources are not
          modeled.

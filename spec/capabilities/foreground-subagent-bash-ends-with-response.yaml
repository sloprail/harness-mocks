statement: >-
  A background command started inside a foreground sub-agent is terminated
  when that sub-agent gives its final response, and the harness says so: in
  the command's receipt, or by reporting its end afterwards.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/tools-reference#background-commands
    runs:
      - claude-mock/snapshots/runs/fg-subagent-bash
  codex:
    supported: false
    reason: Codex has no background-command receipt and its sub-agent does not end what it started; a command the sub-agent put in the background with a shell &, then answered, was still running after the sub-agent had finished.
    runs:
      - codex-mock/snapshots/runs/foreground-subagent-bash-ends-with-response
  cursor:
    docs:
      - https://cursor.com/docs/hooks#subagentstop
    runs:
      - cursor-mock/snapshots/runs/foreground-subagent-bash-ends-with-response
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock dispatches a sub-agent only from a Task call that carries a
          mock-only script playing it, and always in the foreground (a Task that
          asks run_in_background is not run in the background). A hook that refuses the Task call does not stop it, and the
          subagentStart and subagentStop hooks (not recorded firing in a
          print-mode run) do not fire.

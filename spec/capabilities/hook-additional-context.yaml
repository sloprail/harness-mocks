statement: >-
  A hook can return text that is added to the agent's context; the harness
  records it beside the hook's own output.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#add-context-for-claude
    runs:
      - claude-mock/snapshots/runs/hookmix
      - claude-mock/snapshots/runs/stops

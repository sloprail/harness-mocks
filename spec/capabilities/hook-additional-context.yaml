statement: >-
  A hook run at the start of a session, on a submitted prompt, or after a tool
  call succeeds can return text that is added to the agent's context (a
  harness may take it at only some of these); when several hooks return text,
  all of it is kept. A harness that records what its hooks output records the
  text beside the hook's own output. (What a harness does with text too long
  to keep whole is not part of this.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#add-context-for-claude
    runs:
      - claude-mock/snapshots/runs/hookmix
      - claude-mock/snapshots/runs/stops
      - claude-mock/snapshots/runs/ctxmulti
      - claude-mock/snapshots/runs/subagent-post-ctx
      - claude-mock/snapshots/runs/resume-session-start-ctx
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#sessionstart
      - https://developers.openai.com/codex/hooks#userpromptsubmit
      - https://developers.openai.com/codex/hooks#posttooluse
      - https://developers.openai.com/codex/hooks#large-hook-output
    runs:
      - codex-mock/snapshots/runs/stops
      - codex-mock/snapshots/runs/hook-exit-codes
  cursor:
    docs:
      - https://cursor.com/docs/hooks#sessionstart
      - https://cursor.com/docs/hooks#posttooluse
      - https://cursor.com/docs/hooks#posttoolusefailure
    runs:
      - cursor-mock/snapshots/runs/additional-context
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock models a tool failing by an error or by a refusal, not by
          a timeout, so the postToolUseFailure hook's failure_type "timeout"
          and the context its hook adds after a timed-out tool are not modeled.

statement: >-
  A hook is bounded by a timeout; when it expires, the hook and every process
  it spawned are killed, whatever it printed is discarded, and the event
  carries on. (How long a hook with no timeout of its own may run is the
  harness's default for the event. Hooks run in the background, and the
  handler kinds that are neither a command nor an endpoint, are not part of
  this.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#timeouts
      - https://code.claude.com/docs/en/hooks#common-fields
    runs:
      - claude-mock/snapshots/runs/hook-timeout
    deviations:
      - adr: modeled-surface
        statement: >-
          The mock defines and fires none of the PreModelSwitch,
          PostModelSwitch and MessageDisplay events, so the shorter default
          timeouts the docs give them (30 s, 30 s and 10 s), and a timed-out
          PreModelSwitch hook blocking the model switch, are not modeled. The
          mcp_tool hook handler is not implemented either, so a timed-out
          mcp_tool hook's cancellation and discarded output are not modeled.
      - adr: modeled-surface
        statement: >-
          A timed-out PreToolUse hook lets the call fall through to the normal
          permission flow. The mock models a non-interactive run with no
          permission rules evaluated beside the hook, so what a deny or ask
          rule does after a timeout is not modeled.
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#config-shape
    runs:
      - codex-mock/snapshots/runs/hook-timeout
  cursor:
    docs:
      - https://cursor.com/docs/hooks#per-script-configuration-options
    runs:
      - cursor-mock/snapshots/runs/hook-timeout

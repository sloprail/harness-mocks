statement: >-
  Stop hooks that block keep the turn going only a limited number of times in
  a row; once the limit is reached, the next block is overridden and the turn
  ends. (A stop hook that only gives the agent context, without blocking, is
  not part of this.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#stop-input
      - https://code.claude.com/docs/en/hooks#stop-decision-control
      - https://code.claude.com/docs/en/hooks#subagentstop-input
      - https://code.claude.com/docs/en/hooks-guide#stop-hook-hits-the-block-cap
      - https://code.claude.com/docs/en/env-vars#variables
    runs:
      - claude-mock/snapshots/runs/cap
      - claude-mock/snapshots/runs/cap-sub
  codex:
    supported: false
    reason: >-
      Codex has no cap on stop blocks: a Stop hook that blocked 30 times in a
      row kept the turn going each time, and the turn ended only when the
      hook stopped blocking.
    docs:
      - https://developers.openai.com/codex/hooks#stop
    runs:
      - codex-mock/snapshots/runs/stop-block-cap-30
  cursor:
    supported: false
    reason: >-
      In the non-interactive run the stop hook never fires, even after a tool
      call, so a stop hook cannot block the turn and there is nothing for a
      cap to limit.
    runs:
      - cursor-mock/snapshots/runs/stop-block-cap-always

statement: >-
  Stop hooks that block keep the turn going only a limited number of times in
  a row; once the limit is reached, the next block is overridden and the turn
  ends. (A stop hook that only gives the agent context, without blocking, is
  not part of this.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#stop-input
      - https://code.claude.com/docs/en/hooks#stop-decision-control
      - https://code.claude.com/docs/en/hooks#subagentstop-input
      - https://code.claude.com/docs/en/hooks-guide#stop-hook-hits-the-block-cap
      - https://code.claude.com/docs/en/env-vars#variables
    runs:
      - claude-mock/snapshots/runs/cap
      - claude-mock/snapshots/runs/cap-sub
  codex:
    supported: false
    reason: >-
      Codex has no cap on stop blocks: a Stop hook that blocked 30 times in a
      row kept the turn going each time, and the turn ended only when the
      hook stopped blocking.
    docs:
      - https://developers.openai.com/codex/hooks#stop
    runs:
      - codex-mock/snapshots/runs/stop-block-cap-30
  cursor:
    supported: false
    reason: >-
      In the recorded non-interactive run (cursor-agent -p) the stop hook
      never fires, even after a tool call and a completed turn, so a stop
      hook cannot block the turn and there is nothing for a cap to limit.
      Only that mode was recorded; the interactive agent was not.
    docs:
      - https://cursor.com/docs/hooks#stop
      - https://cursor.com/docs/hooks#per-script-configuration-options
    runs:
      - cursor-mock/snapshots/runs/stop-block-cap-always
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Doc and recording conflict: the hooks doc (#stop) says "Called when
          the agent loop ends" and "The default limit is 5 auto follow-ups per
          script, configurable via the `loop_limit` option", and the
          per-script options table (#per-script-configuration-options) gives
          `loop_limit` a default of 5. The recording
          (runs/stop-block-cap-always) configures a stop hook that always
          answers with a followup_message, and shows the stop hook never
          called in cursor-agent -p: only sessionStart and sessionEnd (and no
          afterAgentResponse) reach the hook log, the run ends after one
          turn, and no follow-up is submitted. The recording decides: the cap
          is never reached in print mode.

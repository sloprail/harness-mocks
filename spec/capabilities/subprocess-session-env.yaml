statement: >-
  Processes the harness spawns to run tool commands see environment variables
  that identify the harness and the current session: that they run under the
  harness, how the harness was started, and the session's id. When the harness
  itself runs inside another session, the session's id is this run's. A
  SessionStart hook can write exports to CLAUDE_ENV_FILE, and the session's
  later Bash commands run with that file sourced first. (Other variables the
  harness hands children, such as the project dir, its temp dir or the path of
  its own executable, and the environment of the long-lived servers it starts
  (MCP servers), are other capabilities'.)
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/env-vars#variables
    runs:
      - claude-mock/snapshots/runs/subprocess-session-env
      - claude-mock/snapshots/runs/nested-session-env
      - claude-mock/snapshots/runs/env-file-persist
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock has no interactive session (no /clear, status line command
          or tmux sessions), no PowerShell tool and no Monitor tool, so the
          docs' session id updated on /clear and the variables set for status
          line, tmux, PowerShell and Monitor children are not modeled.
  codex:
    docs:
      - https://developers.openai.com/codex/hooks#common-input-fields
    runs:
      - codex-mock/snapshots/runs/subprocess-session-env
      - codex-mock/snapshots/runs/nested-session-env
      - codex-mock/snapshots/runs/env-names-start-hook
    deviations:
      - adr: modeled-surface
        kind: mock-not-modeled
        statement: >-
          The mock has no interactive session (no /clear, which changes the
          session id in Codex) and its tool executor runs every command with
          /bin/sh, where Codex runs the user's login shell.
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Codex has no env file for a SessionStart hook to write exports to:
          no variable of the environment the start hook, and each hook after
          it, received has ENV, FILE or SOURCE in its name (recorded:
          runs/env-names-start-hook, which logs the names that do).
  cursor:
    docs:
      - https://cursor.com/docs/hooks#environment-variables
    runs:
      - cursor-mock/snapshots/runs/subprocess-session-env
      - cursor-mock/snapshots/runs/nested-session-env
    deviations:
      - adr: capability-grounding
        kind: harness-lacks
        statement: >-
          Cursor has no env file for a sessionStart hook to write exports to:
          the hook's environment, logged whole for every CURSOR and CLAUDE
          variable in the recorded runs, holds the project dir, the version and
          the paths of the agent's own tools, and no variable names a file
          (recorded: runs/subprocess-session-env, nested-session-env).

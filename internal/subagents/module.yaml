# A module is an area of code with a boundary; its decisions live here, not in an ADR.
# No core yet (internal/subagents): the code lives in the claude-mock files below, until it moves.
concern: "a nested agent run: its identity, working directory or worktree, transcript, hooks and result"
home: ["internal/subagents/**", "claude-mock/internal/runner/agent*.go", "claude-mock/internal/runner/session_subagent.go", "codex-mock/internal/runner/agent_tool.go", "codex-mock/internal/runner/agent_host.go", "cursor-mock/internal/runner/agent*.go"]   # everything about the concern lives here
api: ["internal/subagents"]       # the only packages others may import

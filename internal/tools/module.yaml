home: ["internal/tools/**", "claude-mock/internal/toolexec/**", "claude-mock/internal/runner/schedulewakeup.go"]   # everything about the concern lives here
api: ["internal/tools", "claude-mock/internal/toolexec"]       # the only packages others may import

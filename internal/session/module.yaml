# A module is an area of code with a boundary; its decisions live here, not in an ADR.
# Its core is internal/session (find, resume, fork, id); claude-mock's adapter lives in the claude-mock files below.
concern: "finding, resuming and forking a session, and giving it an id"
home: ["internal/session/**", "claude-mock/internal/runner/session_append.go", "claude-mock/internal/runner/session_fork.go", "claude-mock/internal/runner/session_paths.go", "claude-mock/internal/runner/session_resume.go", "claude-mock/internal/runner/session_seed.go", "claude-mock/internal/runner/session_test.go", "claude-mock/internal/runner/fork_test.go", "claude-mock/internal/runner/runner_session_hooks.go", "claude-mock/internal/runner/runner_resume.go", "codex-mock/internal/session/**"]   # everything about the concern lives here
api: ["internal/session", "codex-mock/internal/session"]       # the only packages others may import

# A module is an area of code with a boundary; its decisions live here, not in an ADR.
# Its core is internal/scenario (record type, the run's one result); claude-mock's adapter lives in the claude-mock files below.
concern: "driving the scenario script and routing its records"
home: ["internal/scenario/**", "claude-mock/internal/runner/runner.go", "claude-mock/internal/runner/runner_print.go", "claude-mock/internal/runner/config.go", "claude-mock/internal/runner/record*.go", "claude-mock/internal/runner/stream_scan.go", "claude-mock/main.go", "claude-mock/run.go", "claude-mock/run_flags.go", "claude-mock/e2etest/**", "codex-mock/main.go", "codex-mock/exec.go", "codex-mock/exec_flags.go", "codex-mock/unimplemented.go", "codex-mock/internal/unimplemented/**", "codex-mock/internal/runner/run.go", "codex-mock/internal/events/abort.go", "codex-mock/internal/events/progress.go", "codex-mock/internal/events/stream.go", "cursor-mock/main.go", "cursor-mock/root.go", "cursor-mock/run.go", "cursor-mock/internal/runner/config.go", "cursor-mock/internal/runner/run.go", "cursor-mock/internal/runner/frames.go", "claude-mock/flags.go", "claude-mock/run_env.go", "claude-mock/internal/runner/config_dirs.go", "claude-mock/internal/runner/runner_setup.go", "claude-mock/internal/runner/run_state.go", "claude-mock/internal/runner/invocation.go", "claude-mock/run_limits.go", "claude-mock/internal/runner/nudge.go", "cursor-mock/tui.go", "codex-mock/internal/runner/state.go"]   # everything about the concern lives here
api: ["internal/scenario", "codex-mock/internal/events", "codex-mock/internal/unimplemented"]       # the only packages others may import

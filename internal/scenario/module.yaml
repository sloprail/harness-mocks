# A module is an area of code with a boundary; its decisions live here, not in an ADR.
# Its core is internal/scenario (record type, the run's one result); claude-mock's adapter lives in the claude-mock files below.
concern: "driving the scenario script and routing its records"
home: ["internal/scenario/**", "claude-mock/internal/runner/runner.go", "claude-mock/internal/runner/runner_print.go", "claude-mock/internal/runner/config.go", "claude-mock/internal/runner/record*.go", "claude-mock/internal/runner/stream_scan.go", "claude-mock/e2etest/**", "codex-mock/internal/runner/run.go", "cursor-mock/internal/runner/config.go"]   # everything about the concern lives here
api: ["internal/scenario"]       # the only packages others may import

name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: {}

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 ./claude-mock/internal/...

  rules:
    name: capability rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 ./tools/capcells/

  e2e:
    name: e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # claude-mock's own e2e suite drives real hook flows (see e2e/016_*
      # for the newest), so it needs the same git identity a mocked run
      # itself sets up for any repo it seeds.
      - name: git identity
        run: |
          git config --global user.email ci@sloprail.invalid
          git config --global user.name  harness-mocks CI

      - run: make -C claude-mock test-e2e

  codex-unit:
    name: codex-mock unit tests (with the shared core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make -C codex-mock test-unit

  codex-e2e:
    name: codex-mock e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make -C codex-mock test-e2e

  cursor-unit:
    name: cursor-mock unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make -C cursor-mock test-unit

  cursor-e2e:
    name: cursor-mock e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # the e2e suite replays recorded runs, whose hook scripts use jq
      - name: jq
        run: sudo apt-get install -y jq
      - run: make -C cursor-mock test-e2e

  rules:
    name: rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # the same sr-checks the verify job pins: the tests ask it what each rule's subjects are
      - run: GOBIN="$HOME/.local/bin" go install github.com/sloprail/sloprail/services/sr-checks@3a6b7d71b226232b0a7c751c064ad2413345fbea
      - run: SR_CHECKS="$HOME/.local/bin/sr-checks" .sloprail/tests/subjects.sh

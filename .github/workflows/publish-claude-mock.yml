name: publish claude-mock

# Tag-triggered only — a GitHub Release is the artifact, and a release names
# a version deliberately, not on every push to main the way the old
# a10n-cli/GCP Artifact Registry setup did (date+shortsha on every push to
# services/claude-mock/**). Push a `vX.Y.Z` tag to publish; the tag (minus the v) is embedded as --version.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist)"
        required: true

permissions:
  contents: write # to create the Release and upload assets

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    name: build and publish a10n-claude-mock
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # No CGO / SQLite / fts5 here — claude-mock, unlike the rest of the old
      # a10n-cli monorepo it was extracted from, has no such dependency
      # (verified: CGO_ENABLED=0 builds clean for both targets), so this
      # needs no cross-compiler toolchain (a10n-cli's Zig step was for
      # something else in that repo, not this binary).
      - name: build binaries
        run: |
          set -e
          TAG="${{ inputs.tag || github.ref_name }}"
          mkdir -p dist
          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              echo "building ${GOOS}/${GOARCH}..."
              CGO_ENABLED=0 GOOS=${GOOS} GOARCH=${GOARCH} \
                go build -ldflags "-s -w -X main.version=${TAG#v}" \
                -o "dist/a10n-claude-mock-${GOOS}-${GOARCH}" \
                ./claude-mock
            done
          done
          (cd dist && sha256sum a10n-claude-mock-* > checksums.txt)
          cat dist/checksums.txt

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            dist/a10n-claude-mock-linux-amd64 \
            dist/a10n-claude-mock-linux-arm64 \
            dist/a10n-claude-mock-darwin-amd64 \
            dist/a10n-claude-mock-darwin-arm64 \
            dist/checksums.txt

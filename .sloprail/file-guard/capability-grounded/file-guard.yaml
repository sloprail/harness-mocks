# A capability states what each harness providing it documents or, where its
# docs are silent, what its recorded runs show [judge]. The statement is
# abstract (harness-neutral); each provider's cited doc sections and runs must
# support it, and a recording outranks a doc (adr/capability-grounding): where a run
# and a doc sentence disagree, the run decides. What is
# mocked is the user's choice: adding or dropping a capability or changing its
# statement needs their words (Sloprail-Cites-User,
# added-or-removed.sh); a change confined to the support matrix (a cell's
# docs, runs and deviations) does not
# (adr/capability-grounding). One subject per capability touched (its file, or a doc
# page it cites): subjects.sh splits the changeset, so a change to one capability leaves
# another's verdict alone, and prepare.sh builds the context of the subject it is handed.
match: path startsWith "spec/capabilities/" or path matches "^[a-z0-9]+-mock/snapshots/MANIFEST\\.yaml$"
deletions: include
require:
  - citation: {source_types: [user]}
    when: ./added-or-removed.sh
subjects: ./subjects.sh
checks:
  - prepare: ./prepare.sh
    judge: ./docs-support-statement.md.j2
    # the frozen doc pages live in a cache under the git dir, outside the project
    allowed_tools: [Read]

# A capability states what each harness providing it documents [judge]. The
# statement is abstract (harness-neutral); each provider's cited doc sections
# must support it. Adding or dropping a capability is the user's choice of what
# to mock, so it needs their words (Sloprail-Cites-User); a change to the
# statement or its citations does not. One judge call reviews every capability
# touched (its file, or a doc page it cites; prepare.sh lists them as subjects,
# the engine does not split subjects yet).
match: path startsWith "spec/capabilities/" or path matches "^[a-z0-9]+-mock/snapshots/MANIFEST\\.yaml$"
deletions: include
require:
  - citation: {source_types: [user]}
    when: ./added-or-removed.sh
checks:
  - prepare: ./prepare.sh
    judge: ./docs-support-statement.md.j2
    # the frozen doc pages live in a cache under the git dir, outside the project
    allowed_tools: [Read]

# Every capability is implemented once in core, adapted and proven for every
# harness that provides it, and every harness mock has a cell for it
# [deterministic], over the whole committed tree. Enforces adr/capability-once.
match: >-
  path startsWith "spec/capabilities/" or path matches "^[a-z0-9]+-mock/"
  or any(markers, .kind == "capability" or .kind == "provides" or .kind == "proves")
  or any(oldMarkers, .kind == "capability" or .kind == "provides" or .kind == "proves")
deletions: include
checks:
  - script: ./covered.sh

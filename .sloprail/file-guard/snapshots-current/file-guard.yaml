# Every run of the real-harness snapshots records the binary it was captured with, each
# doc page is frozen by its own hash, every citation into them resolves, and none sits unused
# [deterministic]. A binary update fails nothing: a run keeps the version it was recorded at. One subject per
# harness mock (subjects.sh): a change to one harness's snapshots leaves the others' verdicts
# alone; a change to a capability file is every harness's.
match: path matches "^[a-z0-9]+-mock/snapshots/" or path startsWith "spec/capabilities/"
deletions: include
subjects: ./subjects.sh
checks:
  - script: ./current.sh

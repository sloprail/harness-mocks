# The real-harness snapshots are frozen at one version per harness, every
# citation into them resolves, and none sits unused [deterministic]. Bumping a
# MANIFEST version fails every run and doc still captured at the old one. One subject per
# harness mock (subjects.sh): a change to one harness's snapshots leaves the others' verdicts
# alone; a change to a capability file is every harness's.
match: path matches "^[a-z0-9]+-mock/snapshots/" or path startsWith "spec/capabilities/"
deletions: include
subjects: ./subjects.sh
checks:
  - script: ./current.sh

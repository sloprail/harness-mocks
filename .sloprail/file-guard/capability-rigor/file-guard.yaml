# The mock's e2e tests match the real harness [judge]. For each harness
# providing a capability, the tests marked `sr:proves <capability>/<harness>`
# are compared with what the real harness actually did: the recorded runs the
# capability cites (their normalized events, inlined) and its cited doc
# sections. The tests must drive the mock into the recorded situation and
# assert what the real harness produced (or a declared deviation). The judge holds the tests to the capability's
# STATEMENT (its scope), not to every behaviour its cited docs mention; a green replay of a recorded run proves what it recorded. This is
# the real-vs-mock comparison: the mock is proven by e2e tests, and the tests
# are held to the recordings. One subject per capability touched (subjects.sh; its
# (capability × harness) pairs are judged together), so a change to one capability
# leaves another's verdict alone; a doc re-freeze alone re-judges nothing (docs follow recordings); prepare.sh builds the context of the subject it is handed.
match: >-
  path startsWith "spec/capabilities/" or path matches "^[a-z0-9]+-mock/snapshots/runs/"
  or any(markers, .kind == "capability" or .kind == "provides" or .kind == "proves")
  or any(oldMarkers, .kind == "capability" or .kind == "provides" or .kind == "proves")
subjects: ./subjects.sh
checks:
  - script: ./inputs-ready.sh   # its inputs exist, else no model call
  - prepare: ./prepare.sh
    judge: ./tests-prove-as-documented.md.j2
    # the doc pages live in a cache under the git dir, outside the project
    allowed_tools: [Read]

# Manual compaction in the TUI: one turn, then /compress typed at the idle input. The run waits
# for the stop that follows the compaction, then for the idle screen, and quits (Ctrl+C twice).
timeout: 400s
steps:
  - wait: {screen: "Plan, search, build anything.*<\\?2004h>", timeout: 60s}
  - wait: {hook: sessionStart, timeout: 30s}
  - send: {text_file: prompt.txt, echo: "→ Reply only DONE\\.", keys: [enter]}
  - wait: {hook: stop, timeout: 180s}
  - wait: {screen: "Add a follow-up Auto"}
  - send: {text: "/compress", echo: "→ /compress", keys: [enter]}
  - wait: {hook: stop, nth: 2, timeout: 180s}
  - wait: {screen: "Add a follow-up Auto"}
exit:
  - send: {keys: [ctrl-c]}
  - wait: {screen: "Press Ctrl\\+C again to exit"}
  - send: {keys: [ctrl-c]}
  - wait: {hook: sessionEnd, timeout: 30s}

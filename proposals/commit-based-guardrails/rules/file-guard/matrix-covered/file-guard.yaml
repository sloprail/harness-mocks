# Stage 3 of the invariants funnel [deterministic]: every matrix item has a
# test that proves it, every invariant is covered by an item and implemented
# somewhere, and no marker names an id the catalog does not declare.
#
# Judged over the WHOLE committed tree, not only the diff: deleting a proving
# test, or adding an item, can break coverage in files the change never touched.
match: >-
  path == "spec/invariants.yaml" or path == "spec/matrix.yaml"
  or any(markers, .kind == "invariant" or .kind == "proves")
  or any(oldMarkers, .kind == "invariant" or .kind == "proves")
deletions: include
checks:
  - script: ./coverage.sh

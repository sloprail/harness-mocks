# A feature invariant says what the user asked for, no more and no less
# [grounded + judge]. Adding, rewording or removing one needs the user's words
# on the commit (Sloprail-Cites-User), and a judge checks the words ask for
# exactly that. One subject per invariant file touched.
match: path matches "^spec/invariants/[a-z0-9-]+\\.yaml$"
deletions: include
subjects: ./subjects.sh
require:
  - citation: {source_types: [user]}
checks:
  - judge: ./statement-from-words.md.j2

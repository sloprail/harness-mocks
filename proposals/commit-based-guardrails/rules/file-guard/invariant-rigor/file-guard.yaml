# The tests of an invariant, together, rigorously prove it [judge]. One judge
# per invariant touched (its spec file, a test proving it, or code upholding
# it changed), seeing the statement and EVERY test that proves it.
match: >-
  path startsWith "spec/invariants/"
  or any(markers, .kind == "invariant" or .kind == "proves")
  or any(oldMarkers, .kind == "invariant" or .kind == "proves")
subjects: ./subjects.sh
checks:
  - judge: ./tests-prove-statement.md.j2

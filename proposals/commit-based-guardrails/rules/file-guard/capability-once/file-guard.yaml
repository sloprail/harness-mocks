# Enforces adr/capability-once. The script proves the capability catalog and
# the code agree in both directions: every capability has its one core
# implementation, and every supported (capability × harness) cell has its
# adapter. The judge checks that changed adapter code only translates.
match: >-
  path == "spec/capabilities.yaml"
  or (path endsWith ".go" and not (path endsWith "_test.go")
      and (path startsWith "core/" or path matches "^[a-z0-9]+-mock/"))
  or any(markers, .kind == "capability" or .kind == "provides")
  or any(oldMarkers, .kind == "capability" or .kind == "provides")
deletions: include
checks:
  - script: ./catalog-matches-markers.sh
  - prepare: ../../_lib/linked-adrs.sh
    judge: ../../_lib/adr-conforms.md.j2

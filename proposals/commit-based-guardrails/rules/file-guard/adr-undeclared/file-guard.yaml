# The architecture has no gaps: a change that implements a cross-cutting
# concern (something the code does in more than one place: building a child
# process's environment, firing a hook, writing a record, dispatching an event)
# must fall under an ADR. When no ADR covers the concern, the change fails and
# the decision goes to the user: write a new ADR, or name the one it belongs to.
match: >-
  path endsWith ".go" and not (path endsWith "_test.go")
  and (path startsWith "core/" or path matches "^[a-z0-9]+-mock/")
subjects: ./subjects.sh
checks:
  - prepare: ./all-adrs.sh
    judge: ./classify.md.j2

# Enforces adr/subprocess-env: only internal/procenv builds a child process's environment.
# The script catches the direct form deterministically; the judge catches the
# rest (an env built another way and handed to exec).
match: >-
  path endsWith ".go" and not (path endsWith "_test.go")
  and (path startsWith "internal/" or path matches "^[a-z0-9]+-mock/")
  and not (path contains "/e2etest/")
checks:
  - script: ./no-own-env.sh
  - prepare: ../../_lib/linked-adrs.sh
    judge: ../../_lib/adr-conforms.md.j2

statement: >-
  A PreToolUse hook can refuse a tool call before it runs; the refusal reaches
  the agent as the tool's error result, the tool does not run, and the turn
  goes on.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#pretooluse-decision-control
      - https://code.claude.com/docs/en/hooks#exit-code-2-behavior-per-event
    runs:
      - claude-mock/snapshots/runs/stops
      - claude-mock/snapshots/runs/bashfail

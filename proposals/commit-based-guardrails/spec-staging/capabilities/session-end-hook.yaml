statement: >-
  A hook fires when the session ends and says why; a non-interactive run
  reports a generic reason. Whatever the hook prints is not recorded in the
  transcript.
providers:
  claude:
    docs:
      - https://code.claude.com/docs/en/hooks#sessionend
      - https://code.claude.com/docs/en/hooks#sessionend-input
    runs:
      - claude-mock/snapshots/runs/hookerrors
      - claude-mock/snapshots/runs/resume-unknown
